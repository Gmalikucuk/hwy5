<meta name="theme-color" content="#1f3864">
<style>
  :root{
    --navy:#1f3864; --grey:#6b6b6b; --line:#e3e3e0; --bg:#f6f6f4;
    --card:#ffffff; --green:#2e7d32; --amber:#b26a00; --red:#c0392b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--navy);-webkit-text-size-adjust:100%}
  body{padding-bottom:env(safe-area-inset-bottom)}

  header{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;
    padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;
    align-items:center;gap:12px}
  header .back{font-size:22px;line-height:1;cursor:pointer;padding:2px 6px 2px 0;
    opacity:.9;display:none}
  .logo{width:30px;height:30px;flex-shrink:0;border-radius:6px;background:#fff}
  .biglogo{width:78px;height:78px;border-radius:16px;background:#fff;
    display:block;margin:0 auto 14px;box-shadow:0 2px 10px rgba(0,0,0,.10)}
  .cam{display:flex;align-items:center;gap:6px;padding:6px 10px;margin-left:8px;
    border-radius:9px;background:rgba(255,255,255,.16);cursor:pointer;flex-shrink:0}
  .cam svg{width:19px;height:19px;fill:#fff;opacity:.95}
  .cam b{font-size:13px;font-weight:700}
  .cam.busy{opacity:.55}
  .lock{max-width:320px;margin:60px auto;text-align:center}
  .lock .logo{width:64px;height:64px;margin-bottom:18px}
  .lock h2{margin:0 0 6px;font-size:18px;color:var(--navy)}
  .lock p{margin:0 0 20px;color:var(--grey);font-size:13px}
  .lock input{width:100%;padding:15px;font-size:22px;text-align:center;letter-spacing:.3em;
    font-family:inherit;color:var(--navy);background:var(--card);
    border:1px solid var(--line);border-radius:12px}
  .lock input:focus{outline:0;border-color:var(--navy)}
  .tk{display:flex;align-items:center;gap:10px;padding:13px 14px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;margin-top:14px;cursor:pointer}
  .tk svg{width:22px;height:22px;fill:var(--navy);opacity:.85;flex-shrink:0}
  .tk .t{flex:1;min-width:0}
  .tk .t b{display:block;font-size:15px;color:var(--navy)}
  .tk .t span{font-size:12px;color:var(--grey)}
  .tk .arrow{color:#c9c9c9;font-size:18px}
  #qbar{display:none;background:#fdf0d5;color:#8a5200;padding:9px 14px;font-size:13px;
    border-bottom:1px solid #f0dfb8}
  :root{--amber:#b26a00}
  header h1{margin:0;font-size:17px;font-weight:600;flex:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .act{font-size:13px;opacity:.9;cursor:pointer;padding:4px 2px;white-space:nowrap}

  .wrap{padding:12px 12px 28px}
  .muted{color:var(--grey);font-size:12px}
  .center{text-align:center;padding:40px 20px;color:var(--grey)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    margin-bottom:10px;overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
  .row:active{background:#f0f0ee}
  .row .txt{flex:1;min-width:0}
  .row .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .row .sub{font-size:12px;color:var(--grey);margin-top:3px}
  .row .pct{font-size:19px;font-weight:700;min-width:62px;text-align:right}
  .row .chev{color:#c4c4c4;font-size:18px}

  .bar{height:4px;background:#ececea}
  .bar i{display:block;height:100%;background:var(--green)}

  .grp{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--grey);
    text-transform:uppercase;margin:18px 4px 8px}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px}
  .tile.full{grid-column:1/-1}
  .tile .lab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--grey);font-weight:700}
  .tile .val{font-size:26px;font-weight:700;margin-top:6px;line-height:1.15}
  .tile .val small{font-size:13px;font-weight:600;color:var(--grey);margin-left:4px}
  .tile.hero .val{font-size:40px}
  .g{color:var(--green)} .a{color:var(--amber)} .r{color:var(--red)}

  .note{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px;font-size:13px;color:var(--grey);line-height:1.5}
  .note b{color:var(--navy)}

  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;
    font-weight:600;background:#eef1f7;color:var(--navy)}

  .chk{width:26px;height:26px;border-radius:7px;border:2px solid #cfcfcb;
    display:flex;align-items:center;justify-content:center;font-size:15px;
    color:#fff;flex-shrink:0}
  .chk.on{background:var(--navy);border-color:var(--navy)}

  .btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;
    background:var(--navy);color:#fff;font-size:15px;font-weight:600;
    margin-top:14px;cursor:pointer;font-family:inherit}
  .btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}
  .btn.off{background:transparent;color:#c4c4c4;border:1px solid var(--line);cursor:default}
  .btn.go{background:var(--green);color:#fff;font-size:18px;font-weight:700;padding:18px;
    box-shadow:0 2px 8px rgba(46,125,50,.28)}
  .btn.go:active{background:#256428}
  .btn.save{background:#0b5394;color:#fff;font-size:17px;font-weight:700;padding:17px;
    box-shadow:0 2px 8px rgba(11,83,148,.28)}
  .btn.save:active{background:#08406f}
  .btn.go .sub{display:block;font-size:12px;font-weight:600;opacity:.85;margin-top:2px}
  .btn.off .sub{display:block;font-size:12px;font-weight:500;margin-top:2px}

  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--grey);margin-bottom:6px}
  .fld input,.fld select{width:100%;padding:14px;font-size:17px;font-family:inherit;
    color:var(--navy);background:var(--card);border:1px solid var(--line);
    border-radius:10px;appearance:none;-webkit-appearance:none}
  .fld input:focus,.fld select:focus{outline:0;border-color:var(--navy)}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;padding:14px;font-size:16px;font-weight:700;font-family:inherit;
    border:1px solid var(--line);background:var(--card);color:var(--grey);
    border-radius:10px;cursor:pointer}
  .seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .calc{background:#eef1f7;border-radius:10px;padding:14px;margin-bottom:12px;
    text-align:center}
  .calc .lab{font-size:11px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--grey)}
  .calc .val{font-size:30px;font-weight:700;margin-top:4px}
  .calc .sub{font-size:13px;color:var(--grey);margin-top:4px}
  .err{background:#fdecea;color:var(--red);border-radius:10px;padding:12px;
    font-size:14px;margin-bottom:12px}
  .ok{background:#e9f5ea;color:var(--green);border-radius:10px;padding:14px;
    font-size:15px;font-weight:600;margin-bottom:12px;text-align:center}
  .pts{background:var(--card);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;margin-bottom:12px}
  .pt{display:flex;align-items:center;gap:10px;padding:11px 14px;
    border-bottom:1px solid var(--line);font-size:14px}
  .pt:last-child{border-bottom:0}
  .pt .n{width:22px;height:22px;border-radius:50%;background:#eef1f7;color:var(--navy);
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
    flex-shrink:0}
  .pt .s{font-weight:600;min-width:64px}
  .pt .w{color:var(--grey);min-width:52px}
  .pt .a{flex:1;text-align:right;color:var(--navy);font-weight:600}
  .pt .x{color:#c9c9c9;font-size:20px;padding:0 2px;cursor:pointer}
  .pt.head{background:#fafaf8;font-size:11px;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;color:var(--grey)}
  .ratebar{position:sticky;top:0;z-index:9;background:var(--navy);color:#fff;
    margin:-12px -12px 12px;padding:10px 14px;display:flex;gap:14px;align-items:center}
  .ratebar .b{flex:1;min-width:0}
  .ratebar .l{font-size:9px;letter-spacing:.08em;text-transform:uppercase;opacity:.65}
  .ratebar .v{font-size:17px;font-weight:700;line-height:1.2;white-space:nowrap}
  .ratebar .v small{font-size:11px;font-weight:600;opacity:.7;margin-left:3px}
  .ratebar .good{color:#8ee6a0} .ratebar .warn{color:#ffcf7a}
  #a_bar .rec{display:block;width:100%;padding:12px;border:0;border-radius:0;
    background:#16294a;color:#fff;font-size:14px;font-weight:600;
    font-family:inherit;text-align:center;cursor:pointer}
  #a_bar .rec:active{background:#0f1d36}
  #a_bar .rec.busy{opacity:.6}
  #a_bar{position:sticky;top:0;z-index:8;margin:-12px -12px 12px}
  .rp{background:var(--navy);color:#fff;padding:10px 12px}
  .rp .in{display:flex;gap:8px;margin-bottom:8px}
  .rp .in div{flex:1}
  .rp .in label{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;
    opacity:.65;margin-bottom:3px}
  .rp .in input{width:100%;padding:9px 10px;font-size:16px;font-family:inherit;
    color:#fff;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);
    border-radius:8px;appearance:none;-webkit-appearance:none}
  .rp .in input::placeholder{color:rgba(255,255,255,.45)}
  .rp .in input:focus{outline:0;border-color:rgba(255,255,255,.6)}
  .rp .out{display:flex;gap:12px;align-items:baseline}
  .rp .out .b{flex:1;min-width:0}
  .rp .out .l{font-size:9px;letter-spacing:.08em;text-transform:uppercase;opacity:.65}
  .rp .out .v{font-size:18px;font-weight:700;white-space:nowrap}
  .rp .out .v small{font-size:11px;font-weight:600;opacity:.7;margin-left:2px}
  .rp .good{color:#8ee6a0} .rp .warn{color:#ffcf7a}
  .rp .rec{font-size:11px;opacity:.75;text-decoration:underline;white-space:nowrap}
  .hd{position:sticky;top:0;z-index:8;background:var(--navy);color:#fff;
    margin:-12px -12px 12px;padding:10px 14px}
  .hd .t{display:flex;align-items:baseline;gap:8px}
  .hd .t .l{font-size:9px;letter-spacing:.08em;text-transform:uppercase;opacity:.65}
  .hd .t .v{font-size:26px;font-weight:700;line-height:1.1}
  .hd .t .v small{font-size:12px;font-weight:600;opacity:.7;margin-left:3px}
  .ctx{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;
    opacity:.85;cursor:pointer}
  .ctx .chev{opacity:.6;font-size:11px}
  .ctx.todo{color:#ffcf7a;opacity:1}
  .spin{width:22px;height:22px;border:2px solid #dcdcda;border-top-color:var(--navy);
    border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* the truck shortcut: a sheet over the current screen, so a truck can be
     recorded without leaving the paving screen */
  .mask{position:fixed;inset:0;background:rgba(20,25,40,.45);z-index:50;
    display:flex;align-items:flex-end;justify-content:center}
  .msheet{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;
    padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;
    box-shadow:0 -6px 24px rgba(0,0,0,.18)}
  .mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .mhead b{font-size:17px}
  .mx{font-size:26px;color:var(--grey);line-height:1;padding:0 6px}
</style>

<script>
/* --------------------------------------------------------------- transport
   There is no google.script.run on a static host. This stands in for it and
   posts to the same Apps Script endpoint. Nothing below this line changes.  */

var API_URL = window.API_URL || '';

function newRunner(){
  var r = { _s:null, _f:null };
  r.withSuccessHandler = function(f){ this._s=f; return this; };
  r.withFailureHandler = function(f){ this._f=f; return this; };

  function shape(name, a){
    if(name==='getProgress') return { code_:a[0] };
    if(name==='daySoFar')    return { code:a[0], date:a[1], site:a[2], code_:a[3] };
    if(name==='photoCount')  return { code:a[0], date:a[1], site:a[2], code_:a[3] };
    return a[0] || {};
  }

  /* Every call the server offers. Keep this in step with API in WebApp.gs:
     a name missing here does not error, it simply never returns, and the
     screen waits for an answer that is not coming. */
  ['getProgress','daySoFar','photoCount','photosFor','deletePhoto',
   'postEntry','postMeasurement','postDayTonnage','postEstimate','postPhoto',
   'postTruck','trucksToday','editEntry','coverage',
   'tackForDay','postTack','saveDayDetails','dayDetails','forecastBase'].forEach(function(name){
    r[name] = function(){
      var args = Array.prototype.slice.call(arguments);
      var payload = (args.length===1 && args[0] && typeof args[0]==='object')
        ? args[0] : shape(name, args);
      if(payload.code_===undefined) payload.code_ = CODE;
      var self = this;
      // text/plain so the browser does not send a preflight, which Apps
      // Script has no way to answer
      fetch(API_URL, { method:'POST', redirect:'follow',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn:name, payload:payload }) })
        .then(function(res){ return res.json(); })
        .then(function(out){
          if(!out) throw new Error('Nothing came back.');
          if(out.ok!==true){
            if(out.locked && self._s){ self._s({ locked:true }); return; }
            throw new Error(out.message || 'The server refused that.');
          }
          if(self._s) self._s(out.result);
        })
        .catch(function(err){ if(self._f) self._f(err); });
      return this;
    };
  });
  return r;
}

var google = { script: {} };
Object.defineProperty(google.script, 'run', { get: function(){
  var r = newRunner();
  // anything not wired up should say so at once rather than wait for ever
  return new Proxy(r, { get: function(t, k){
    if(k in t) return t[k];
    if(typeof k === 'string' && k.indexOf('_') !== 0)
      return function(){ if(t._f) t._f(new Error('That call is not wired up: '+k)); return t; };
    return undefined;
  }});
}});

/* A photo is large. Rather than let the queue burst its limit silently,
   refuse politely and say why. */
function queueRoom(extra){
  try{
    var now = (localStorage.getItem(QKEY) || '').length;
    return (now + extra) < 3500000;
  }catch(e){ return true; }
}

var DATA = null, PINS = null, SCREEN = 'home', CURRENT = null;
var KEY = 'hwy5.pins.v1';
var CKEY = 'hwy5.code.v1';
var QKEY = 'hwy5.queue.v1';
var SKEY = 'hwy5.site.v1';
var CODE = '';

function loadCode(){
  try{ CODE = localStorage.getItem(CKEY) || ''; }catch(e){ CODE=''; }
}
function saveCode(c){
  CODE = c;
  try{ localStorage.setItem(CKEY, c); }catch(e){}
}

/* ------------------------------------------------------------------ offline
   Snowshed has no signal. Everything the crew saves is written to the phone
   first and sent afterwards, in the order it was entered. Nothing is lost by
   being out of coverage; it simply waits.

   The app itself still has to be loaded while there IS signal, and the tab
   kept open — Apps Script cannot be cached for a cold start.                */

var QUEUE = [];
var SENDING = false;

/**
 * Where the trucks have been arriving today.
 *
 * Loads come from the plant to one place and keep coming there, so after the
 * first truck the site is already known. This is only for the trucks screen:
 * the crews work different sites on the same day, and carrying a site across
 * the measurement screens would file work in the wrong place.
 */
function todaySite(){
  try{
    var raw = JSON.parse(localStorage.getItem(SKEY) || 'null');
    if(raw && raw.date === DATA.today) return raw.site;
  }catch(e){}
  return '';
}

function rememberSite(site){
  if(!site) return;
  try{ localStorage.setItem(SKEY, JSON.stringify({date:DATA.today, site:site})); }catch(e){}
}

function loadQueue(){
  try{ QUEUE = JSON.parse(localStorage.getItem(QKEY) || '[]') || []; }catch(e){ QUEUE = []; }
}
function saveQueue(){
  try{ localStorage.setItem(QKEY, JSON.stringify(QUEUE)); }catch(e){}
}

function queueSize(){ return QUEUE.length; }

/** Puts a save on the phone. It goes out when the signal allows. */
function enqueue(fn, payload, describe){
  QUEUE.push({ fn:fn, payload:payload, what:describe, at:Date.now() });
  saveQueue();
  flushQueue();
}

/**
 * Sends one at a time, oldest first. Order matters: a measurement has to reach
 * the sheet before the day that depends on it is closed.
 */
function flushQueue(after){
  if(SENDING || !QUEUE.length){ if(after) after(); return; }
  SENDING = true; showQueue();
  var job = QUEUE[0];
  google.script.run
    .withSuccessHandler(function(res){
      SENDING = false;
      if(res && res.locked){ showQueue(); if(after) after(); return; }   // wrong code
      QUEUE.shift(); saveQueue(); showQueue();
      if(QUEUE.length) flushQueue(after); else if(after) after();
    })
    .withFailureHandler(function(){
      SENDING = false; showQueue();          // still no signal; it waits
      if(after) after();
    })[job.fn](job.payload);
}

function showQueue(){
  var el = document.getElementById('qbar');
  if(!el) return;
  var n = QUEUE.length;
  if(!n){ el.style.display='none'; return; }
  el.style.display='block';
  el.innerHTML = '<b>'+n+'</b> '+(n===1?'entry':'entries')+' waiting on this phone'+
    (SENDING ? ' \u00b7 sending\u2026'
             : ' <span style="text-decoration:underline" onclick="flushQueue()">send now</span>');
}

function askCode(wrong){
  document.getElementById('back').style.display='none';
  document.getElementById('title').textContent='Hwy 5 Progress';
  document.getElementById('act').textContent='';

function tryCode(){
  var el=document.getElementById('c_in');
  var v=el?String(el.value||'').trim():'';
  if(!v) return;
  saveCode(v);
  refresh(true);
}
var DKEY = 'hwy5.drafts.v1';
var DRAFTS = {};

function loadDrafts(){
  try{
    var raw = localStorage.getItem(DKEY);
    if(raw) DRAFTS = JSON.parse(raw) || {};
  }catch(e){ DRAFTS = {}; }
}
function saveDrafts(){
  try{ localStorage.setItem(DKEY, JSON.stringify(DRAFTS)); }catch(e){}
}
function draftCount(code){
  var d = DRAFTS[code];
  return d && d.segs ? d.segs.length : 0;
}

/**
 * Whether this browser will actually keep anything.
 *
 * Safari refuses storage to a page inside a cross-origin frame, which is how
 * Apps Script serves it. Nothing then persists: not the chosen items, not the
 * passcode, and — the part that matters — not the queue of work waiting to be
 * sent. Better to say so than to lose entries quietly.
 */
var STORAGE_OK = (function(){
  try{
    localStorage.setItem('hwy5.test','1');
    var ok = localStorage.getItem('hwy5.test')==='1';
    localStorage.removeItem('hwy5.test');
    return ok;
  }catch(e){ return false; }
})();

function warnIfNoStorage(){
  if(STORAGE_OK) return;
  var el=document.getElementById('qbar');
  if(!el) return;
  el.style.display='block';
  el.style.background='#fdecea';
  el.style.color='#a4231c';
  el.innerHTML='<b>This phone is not keeping anything.</b> Chosen items and any '+
    'work saved out of signal will be lost when the page reloads. Open the app '+
    'from its own address rather than through Google.';
}

function loadPins(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return ['04.04.02','05.03.04'];      // Job B starts first
}
function savePins(){
  try{ localStorage.setItem(KEY, JSON.stringify(PINS)); }catch(e){}
}

function num(n, dp){
  if(n === null || n === undefined) return '—';
  return n.toLocaleString(undefined,{minimumFractionDigits:dp||0,maximumFractionDigits:dp||0});
}
function pctTxt(p){ return p === null ? '—' : (p*100).toFixed(1)+'%'; }
function pctClass(p){
  if(p === null) return '';
  if(p >= 0.999) return 'g';
  if(p >= 0.75) return 'a';
  return '';
}
function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function byCode(c){
  for(var i=0;i<DATA.items.length;i++) if(DATA.items[i].code===c) return DATA.items[i];
  return null;
}

function rowHtml(it, onclick){
  var p = it.pct === null ? 0 : Math.max(0, Math.min(1, it.pct));
  var dc = draftCount(it.code);
  return '<div class="card">'+
    '<div class="row" onclick="'+onclick+'">'+
      '<div class="txt">'+
        '<div class="nm">'+esc(it.name)+
          (dc ? ' <span class="pill" style="background:#fdf0d5;color:#b26a00">'+dc+
                ' unsaved</span>' : '')+'</div>'+
        '<div class="sub">'+esc(it.code)+' · '+num(it.total)+' of '+num(it.contract)+
          ' '+esc(it.uom)+'</div>'+
      '</div>'+
      '<div class="pct '+pctClass(it.pct)+'">'+pctTxt(it.pct)+'</div>'+
      '<div class="chev">&#8250;</div>'+
    '</div>'+
    '<div class="bar"><i style="width:'+(p*100).toFixed(1)+'%"></i></div>'+
  '</div>';
}

function renderHome(){
  SCREEN='home'; CURRENT=null;
  document.getElementById('back').style.display='none';
  document.getElementById('title').textContent='Hwy 5 Progress';
  var a=document.getElementById('act'); a.textContent='Edit'; a.onclick=renderPicker;

  var h='';
  if(PINS.length===0){
    h='<div class="center">No items chosen yet.<br><br>'+
      '<button class="btn" onclick="renderPicker()">Choose items</button></div>';
  }else{
    var groups=[], pinned=[];
    for(var i=0;i<PINS.length;i++){
      var it=byCode(PINS[i]);
      if(!it) continue;
      pinned.push(it);
      if(groups.indexOf(it.group)<0) groups.push(it.group);
    }
    // ordered as the contract does, so Job A work sits together
    var order=['Job A','Job B','Job C','Shared','Barriers'];
    groups.sort(function(a,b){ return order.indexOf(a)-order.indexOf(b); });
    groups.forEach(function(g){
      h+='<div class="grp">'+esc(g)+'</div>';
      pinned.filter(function(x){return x.group===g;}).forEach(function(x){
        h+=rowHtml(x,"openItem('"+x.code+"')");
      });
    });
    h+='<div class="tk" onclick="TRUCK=null;openTrucks()">'+

function renderPicker(){
  SCREEN='picker'; 
  document.getElementById('back').style.display='block';
  document.getElementById('back').onclick=renderHome;
  document.getElementById('title').textContent='Choose items';
  var a=document.getElementById('act'); a.textContent='Done'; a.onclick=renderHome;

  var groups=[], h='';
  DATA.items.forEach(function(it){ if(groups.indexOf(it.group)<0) groups.push(it.group); });
  var order=['Job A','Job B','Job C','Shared','Barriers'];
  groups.sort(function(a,b){ return order.indexOf(a)-order.indexOf(b); });
  groups.forEach(function(g){
    h+='<div class="grp">'+esc(g)+'</div>';
    DATA.items.filter(function(it){return it.group===g;}).forEach(function(it){
      var on=PINS.indexOf(it.code)>=0;

         '<div class="chk'+(on?' on':'')+'">'+(on?'&#10003;':'')+'</div>'+

function toggle(code){

  renderPicker();
}

/* ---------------------------------------------------------------- entry */
var FORM = null;

function staTxt(n){
  if(n===null||n===undefined||n==='') return '';
  n = Math.round(Number(n));
  if(!isFinite(n)) return '';
  var km = Math.floor(Math.abs(n)/1000), m = Math.abs(n)%1000;
  return (n<0?'-':'')+km+'+'+('00'+m).slice(-3);
}

/**
 * Typed fields update only the small computed blocks. Redrawing the screen
 * would destroy whichever box is being typed into, and putting the focus back
 * afterwards is not something a phone does reliably — the keyboard drops.
 * The buttons, which are tapped rather than typed into, may redraw freely.
 */
var fdateTimer=null;

/**
 * The same wheel, the same problem: iPhone fires change while it is still
 * spinning, and redrawing then closes the picker under the finger.
 */
function fdateChanged(v){
  if(!FORM) return;
  FORM.date=v; FORM.err='';
  if(fdateTimer) clearTimeout(fdateTimer);
  fdateTimer=setTimeout(fdateSettled, 600);
}

function fdateSettled(){
  if(fdateTimer){ clearTimeout(fdateTimer); fdateTimer=null; }
  if(!FORM) return;
  openEntry(FORM.code, FORM.ok);
  loadEntries();
}

function fset(k,v){
  FORM[k]=v; FORM.err='';
  if(k==='date'||k==='site') loadEntries();
  PHOTO.where=entryWhere();

  var typed = (k==='from'||k==='to'||k==='qty'||k==='at'||k==='fac'||k==='loc');
  if(typed){
    var c=document.getElementById('f_calc'); if(c) c.innerHTML=lengthHtml();
    var u=document.getElementById('f_cut');  if(u) u.innerHTML=cutBtnHtml();
    return;
  }
  if(k==='dir'||k==='lane'||k==='way'||k==='site'||k==='date') openEntry(FORM.code, FORM.ok);
}

/** What is already on the sheet for this item, day and site. */
/** What the grinder usually cuts, unless the person measured otherwise. */
function cutFactor(){
  var f=Number(FORM.fac);
  if(isFinite(f)&&f>0) return f;
  return FORM.way==='L' ? 2.2 : 5.0;
}

function addCut(){
  if(!FORM.way || !(Number(FORM.qty)>0)) return;
  var m=Number(FORM.qty), fac=cutFactor();
  FORM.cuts=(FORM.cuts||[]).concat([{m:m, way:FORM.way, fac:fac,
                                     area:Math.round(m*fac*100)/100}]);
  FORM.qty='';
  openEntry(FORM.code, FORM.ok);
}

function dropCut(i){
  FORM.cuts.splice(i,1);
  openEntry(FORM.code, FORM.ok);
}

/* An entry already on the tracker can be put right from here, so nobody has
   to open the sheet to fix a typed figure. Anything already reported to the
   ministry is left alone: a silent change would leave the two out of step. */

/** Takes a photograph against one entry rather than the screen in general. */
function photoForRow(tag){
  PHOTO.tag = tag || '';
  var el=document.getElementById('camIn');
  if(el){ el.value=''; el.setAttribute('data-for',''); el.click(); }
}

function editRow(row){
  var e=(FORM.entries||[]).filter(function(x){return x.row===row;})[0];
  if(!e) return;
  FORM.editing=row; FORM.editQty=String(e.qty); FORM.editLoc=e.loc||'';
  openEntry(FORM.code, FORM.ok);
}

function saveEdit(row){
  if(!(Number(FORM.editQty)>0)){ FORM.err='Enter a quantity.'; openEntry(FORM.code); return; }
  var payload={code_:CODE, code:FORM.code, row:row,
               qty:FORM.editQty, loc:FORM.editLoc};
  google.script.run
    .withSuccessHandler(function(res){
      if(!res.ok){ FORM.err=res.message; openEntry(FORM.code); return; }
      if(res.item && res.item.code===FORM.code){
        for(var i=0;i<DATA.items.length;i++)
          if(DATA.items[i].code===FORM.code){ DATA.items[i]=res.item; break; }
      }
      FORM.editing=null; FORM.err='';
      openEntry(FORM.code, 'Changed.');
      loadEntries();
    })
    .withFailureHandler(function(){
      enqueue('editEntry', payload, 'a correction');
      FORM.editing=null;
      openEntry(FORM.code, 'Correction held on this phone.');
    })
    .editEntry(payload);
}

function removeRow(row){
  var payload={code_:CODE, code:FORM.code, row:row, remove:true};
  google.script.run
    .withSuccessHandler(function(res){
      if(!res.ok){ FORM.err=res.message; openEntry(FORM.code); return; }
      if(res.item && res.item.code===FORM.code){
        for(var i=0;i<DATA.items.length;i++)
          if(DATA.items[i].code===FORM.code){ DATA.items[i]=res.item; break; }
      }
      FORM.editing=null; FORM.err='';
      openEntry(FORM.code, 'Removed.');
      loadEntries();
    })
    .withFailureHandler(function(){
      enqueue('editEntry', payload, 'a removal');
      FORM.editing=null;
      openEntry(FORM.code, 'Removal held on this phone.');
    })
    .editEntry(payload);
}

function loadEntries(){
  if(!FORM||!FORM.date||!FORM.site) return;
  var code=FORM.code, d=FORM.date, st=FORM.site;
  google.script.run.withSuccessHandler(function(res){
    if(!FORM||FORM.code!==code||FORM.date!==d||FORM.site!==st) return;
    if(!res||!res.ok) return;
    var before=(FORM.entries||[]).length;
    FORM.entries=res.entries||[];
    if(before!==FORM.entries.length || before>0) openEntry(code, FORM.ok);
  }).withFailureHandler(function(){}).daySoFar(code,d,st,CODE);
}

function lengthHtml(){
  var L=lengthOf();
  return '<div class="calc"><div class="lab">Quantity</div>'+
         '<div class="val'+(L.bad?' r':'')+'">'+(L.text)+'</div>'+
         '<div class="sub">'+esc(L.note)+'</div></div>';
}

function cutBtnHtml(){
  var ok = FORM.way && Number(FORM.qty)>0;
  return ok
    ? '<button class="btn go" onclick="addCut()">Add '+
      (Math.round(Number(FORM.qty)*cutFactor()*100)/100).toLocaleString()+' m²'+
      '<span class="sub">'+esc(FORM.qty)+' \u00d7 '+cutFactor()+' m</span></button>'
    : '<button class="btn off">Add this measurement</button>';
}

function lengthOf(){
  var f=Number(FORM.from), t=Number(FORM.to);
  if(FORM.from===''||FORM.to===''||!isFinite(f)||!isFinite(t))
    return {text:'—', note:'Enter both stations', bad:false};
  if(f===t) return {text:'0 m', note:'Same station twice', bad:true};
  if(FORM.dir==='NB'&&t<f)
    return {text:'—', note:'Northbound counts up — To must be higher', bad:true};
  if(FORM.dir==='SB'&&t>f)
    return {text:'—', note:'Southbound counts down — To must be lower', bad:true};
  var L=Math.abs(t-f);
  return {text:L.toLocaleString()+' m',
          note:FORM.dir+' '+staTxt(f)+' to '+staTxt(t), bad:false};
}

function submitEntry(){
  var it=byCode(FORM.code), epayload=null;
  document.getElementById('view').innerHTML=
    '<div class="center"><div class="spin"></div>Saving…<br>'+
    '<span class="muted">a few seconds</span></div>';
  google.script.run
    .withSuccessHandler(function(res){
      if(!res.ok){
        FORM.err=res.message; FORM.ok='';
        openEntry(FORM.code);
        return;
      }
      var saved='Saved '+res.qty.toLocaleString()+' '+it.uom+' \u2014 '+res.loc;
      var code=FORM.code;
      // only ever replace an item with itself
      if(res.item && res.item.code===code){
        for(var i=0;i<DATA.items.length;i++){
          if(DATA.items[i].code===code){ DATA.items[i]=res.item; break; }
        }
      }
      // the day, the place and the direction carry over: the next entry is
      // almost always the same day at the same site
      FORM.qty=''; FORM.from=''; FORM.to=''; FORM.at='';
      FORM.loc=''; FORM.cuts=[]; FORM.way='';
      FORM.err=''; FORM.ok=saved; FORM.tag='';
      SHOTS.key='';
      openEntry(code, saved);
      loadEntries();
    })
    .withFailureHandler(function(){
      enqueue('postEntry', epayload, it.name+' \u2014 '+(FORM.qty||'entry'));
      FORM.qty=''; FORM.from=''; FORM.to=''; FORM.at='';
      FORM.loc=''; FORM.cuts=[]; FORM.way=''; FORM.err='';
      openEntry(FORM.code, 'Held on this phone \u2014 it will be sent when there is signal.');
    })
    .postEntry(epayload={code_:CODE, code:FORM.code, date:FORM.date, site:FORM.site, dir:FORM.dir,
                lane:FORM.lane, way:FORM.way, fac:FORM.fac, at:FORM.at, cuts:FORM.cuts,
                from:FORM.from, to:FORM.to, qty:FORM.qty, loc:FORM.loc});
}

       '<input type="text" value="'+esc(TRUCK.note)+'" '+

       TRUCK.today.length+' truck'+(TRUCK.today.length===1?'':'s')+

         '</div><div class="a">'+esc(t.at)+'</div></div>';

var tdateTimer=null;
function tdateChanged(v){
  if(!TRUCK) return;
  TRUCK.date=v; TRUCK.err='';
  if(tdateTimer) clearTimeout(tdateTimer);
  tdateTimer=setTimeout(tdateSettled, 600);
}
function tdateSettled(){
  if(tdateTimer){ clearTimeout(tdateTimer); tdateTimer=null; }
  if(!TRUCK) return;
  openTrucks(); loadTrucks();
}

function tset(k,v){
  TRUCK[k]=v; TRUCK.err='';
  if(k==='site') rememberSite(v);
  openTrucks();
  if(k==='date'||k==='site') loadTrucks();
}
function tfield(k,v){
  TRUCK[k]=v;
  // only the button reacts, so neither the truck nor the tonnage field
  // redraws mid-type and drops the keyboard
  if(k==='truck') openTrucks();
}

function loadTrucks(){
  if(!TRUCK||!TRUCK.date||!TRUCK.site) return;
  var d=TRUCK.date, st=TRUCK.site;
  google.script.run.withSuccessHandler(function(list){
    if(!TRUCK||TRUCK.date!==d||TRUCK.site!==st) return;
    TRUCK.today=list||[];
    TRUCK.dayT=(list||[]).reduce(function(a,t){ return a+(Number(t.tonnes)||0); },0);
    openTrucks();
  }).withFailureHandler(function(){}).trucksToday(d, st, CODE);
}

function truckPhoto(){
  if(TRUCK.busy || !TRUCK.truck.trim()) return;
  var el=document.getElementById('camIn');
  if(!el) return;
  el.value=''; el.setAttribute('data-for','truck'); el.click();
}

function sendTruck(data){
  TRUCK.busy=true; openTrucks();
  var payload={code_:CODE, date:TRUCK.date, site:TRUCK.site, truck:TRUCK.truck.trim(),
               tonnes:(TRUCK.tonnes===''?'':TRUCK.tonnes), item:'', note:TRUCK.note, data:data};
  google.script.run
    .withSuccessHandler(function(res){
      TRUCK.busy=false;
      if(!res.ok){ TRUCK.err=res.message; openTrucks(); return; }
      TRUCK.ok='Truck '+res.truck+' recorded at '+res.at;
      TRUCK.truck=''; TRUCK.tonnes=''; TRUCK.note=''; TRUCK.err='';
      if(res.dayTonnes!=null) TRUCK.dayT=res.dayTonnes;
      openTrucks(); loadTrucks();
    })
    .withFailureHandler(function(){
      TRUCK.busy=false;
      enqueue('postTruck', payload, 'truck '+payload.truck);
      TRUCK.ok='Truck '+payload.truck+' held on this phone.';
      TRUCK.truck=''; TRUCK.tonnes=''; TRUCK.note='';
      openTrucks();
    })
    .postTruck(payload);
}

/* ----------------------------------------------------------- forecast modal
   The superintendent's question, answered from the current lane's blocks: from
   the last station, how much tonnage reaches a station, or what station a
   tonnage reaches. The running weighted rate and average width come from the
   blocks and seed the fields; either can be overridden. Nothing is written —
   a simulated next block laid onto the end of the chain.                     */

var FCAST = null;

function openForecast(){
  if(!AREA || !AREA.date || !AREA.site) return;
  FCAST = {loading:true, base:null, rate:'', width:'', mode:'toStation',
           tonnage:'', target:'', err:''};
  drawForecast();
  google.script.run.withSuccessHandler(function(res){
    if(!FCAST) return;
    FCAST.loading=false;
    if(!res || !res.ok || !res.has){
      FCAST.err = 'No blocks on this lane yet, so there is nothing to forecast from.';
      drawForecast(); return;
    }
    FCAST.base = res;
    // seed the overridable fields with the running figures
    FCAST.rate = res.rate!=null ? String(res.rate) : (res.design!=null?String(res.design):'');
    FCAST.width = res.avgWidth!=null ? String(res.avgWidth) : '';
    drawForecast();
  }).withFailureHandler(function(){
    if(!FCAST) return;
    FCAST.loading=false; FCAST.err='Could not read the lane. Try again.'; drawForecast();
  }).forecastBase({code:AREA.code, date:AREA.date, site:AREA.site, code_:CODE});
}

function closeForecast(){ FCAST=null; var m=document.getElementById('fmod'); if(m) m.remove(); }
function fmask(ev){ if(ev.target===ev.currentTarget) closeForecast(); }

function fcalc(){
  var b=FCAST.base; if(!b) return null;
  var rate=Number(FCAST.rate), width=Number(FCAST.width);
  if(!(rate>0) || !(width>0)) return null;
  var start=b.lastStation;
  if(FCAST.mode==='toStation'){
    // given tonnage -> station reached
    var t=Number(FCAST.tonnage); if(!(t>0)) return null;
    var area=t*1000/rate;          // kg / (kg/m2) = m2
    var len=area/width;            // m
    return {kind:'toStation', len:len, area:area,
            station:start+len, from:start};
  }else{
    // given target station -> tonnage needed
    var tgt=Number(FCAST.target); if(FCAST.target==='' || !isFinite(tgt)) return null;
    var len=Math.abs(tgt-start);
    var area=len*width;
    var t=area*rate/1000;          // m2 * kg/m2 / 1000 = tonnes
    return {kind:'toTonnage', len:len, area:area, tonnes:t, from:start, target:tgt};
  }
}

function drawForecast(){
  if(!FCAST) return;
  var h='<div class="mask" onclick="fmask(event)"><div class="msheet">'+
        '<div class="mhead"><b>Forecast</b>'+
        '<span class="mx" onclick="closeForecast()">\u00d7</span></div>';

  if(FCAST.loading){
    h+='<div class="center" style="padding:30px 0"><div class="spin"></div>Reading the lane\u2026</div>';
    h+='</div></div>'; putForecast(h); return;
  }
  if(FCAST.err){
    h+='<div class="err">'+esc(FCAST.err)+'</div></div></div>'; putForecast(h); return;
  }

  var b=FCAST.base;
  // the running picture
  h+='<div class="muted" style="margin-bottom:10px">'+esc(b.dir)+' '+esc(b.lane)+
     '  \u00b7  now at <b style="color:var(--navy)">'+esc(staTxt(b.lastStation))+'</b></div>';
  h+='<div class="calc" style="margin-bottom:12px"><div class="lab">Running so far</div>'+
     '<div style="font-size:13px;line-height:1.6">'+
     (b.rate!=null?'Rate <b>'+b.rate.toFixed(1)+' kg/m\u00b2</b>'+
        (b.design?' \u00b7 <b>'+(b.rate/b.design*100).toFixed(1)+'%</b>':''):
        'No block tonnages yet \u2014 rate unknown')+'<br>'+
     (b.avgWidth!=null?'Average width <b>'+b.avgWidth.toFixed(2)+' m</b>':'')+
     '</div></div>';

  // overridable rate + width
  h+='<div class="two">'+
     '<div class="fld"><label>Rate (kg/m\u00b2)</label>'+
     '<input type="number" inputmode="decimal" step="0.1" value="'+esc(FCAST.rate)+'" '+
     'oninput="ffield(\'rate\',this.value)"></div>'+
     '<div class="fld"><label>Average width (m)</label>'+
     '<input type="number" inputmode="decimal" step="0.01" value="'+esc(FCAST.width)+'" '+
     'oninput="ffield(\'width\',this.value)"></div></div>';

  // which way round
  h+='<div class="seg2" style="display:flex;gap:8px;margin:6px 0 12px">'+
     '<button class="btn '+(FCAST.mode==='toStation'?'go':'ghost')+'" style="flex:1" '+
     'onclick="fmode(\'toStation\')">Tonnage \u2192 station</button>'+
     '<button class="btn '+(FCAST.mode==='toTonnage'?'go':'ghost')+'" style="flex:1" '+
     'onclick="fmode(\'toTonnage\')">Station \u2192 tonnage</button></div>';

  if(FCAST.mode==='toStation'){
    h+='<div class="fld"><label>Tonnage to place</label>'+
       '<input type="number" inputmode="decimal" step="0.01" value="'+esc(FCAST.tonnage)+'" '+
       'placeholder="tonnes" oninput="ffield(\'tonnage\',this.value)"></div>';
  }else{
    h+='<div class="fld"><label>Target station</label>'+
       '<input type="number" inputmode="numeric" value="'+esc(FCAST.target)+'" '+
       'placeholder="e.g. 50000" oninput="ffield(\'target\',this.value)"></div>';
  }

  h+='<div id="f_out">'+forecastOut()+'</div>';
  h+='</div></div>';
  putForecast(h);
}

function forecastOut(){
  var r=fcalc();
  if(!r) return '<div class="note">Enter the figures above.</div>';
  if(r.kind==='toStation'){
    return '<div class="calc"><div class="lab">Reaches</div>'+
      '<div class="val">'+esc(staTxt(Math.round(r.station)))+'</div>'+
      '<div style="font-size:12px;color:var(--grey);margin-top:4px">'+
      Math.round(r.len).toLocaleString()+' m further \u00b7 '+
      Math.round(r.area).toLocaleString()+' m\u00b2 \u00b7 from '+esc(staTxt(r.from))+'</div></div>';
  }
  return '<div class="calc"><div class="lab">Tonnage needed</div>'+
    '<div class="val">'+r.tonnes.toLocaleString(undefined,{maximumFractionDigits:1})+
    '<small> t</small></div>'+
    '<div style="font-size:12px;color:var(--grey);margin-top:4px">'+
    Math.round(r.len).toLocaleString()+' m \u00b7 '+
    Math.round(r.area).toLocaleString()+' m\u00b2 \u00b7 '+
    esc(staTxt(r.from))+' to '+esc(staTxt(r.target))+'</div></div>';
}

function ffield(k,v){ FCAST[k]=v; var o=document.getElementById('f_out'); if(o) o.innerHTML=forecastOut(); }
function fmode(m){ FCAST.mode=m; drawForecast(); }

function putForecast(h){
  var m=document.getElementById('fmod');
  if(!m){ m=document.createElement('div'); m.id='fmod'; document.body.appendChild(m); }
  m.innerHTML=h;
}

function tmField(k,v){ TMOD[k]=v; if(k==='truck') drawTruckModal(); }

function tmPhoto(){

function tmSend(data){
  TMOD.busy=true; drawTruckModal();
  var payload={code_:CODE, date:TMOD.date, site:TMOD.site, truck:TMOD.truck.trim(),
               tonnes:(TMOD.tonnes===''?'':TMOD.tonnes), item:'', note:TMOD.note, data:data};
  google.script.run
    .withSuccessHandler(function(res){
      if(!TMOD) return;
      TMOD.busy=false;
      if(!res.ok){ TMOD.err=res.message; drawTruckModal(); return; }
      // keep the Trucks screen total in step if it is loaded
      if(TRUCK && TRUCK.date===TMOD.date && TRUCK.site===TMOD.site) loadTrucks();
      closeTruckModal();
      AREA.ok='Truck '+res.truck+' recorded at '+res.at+'.';
      openArea(AREA.code, AREA.ok);
    })
    .withFailureHandler(function(){
      if(!TMOD) return;
      TMOD.busy=false;
      enqueue('postTruck', payload, 'truck '+payload.truck);
      closeTruckModal();
      AREA.ok='Truck '+payload.truck+' held on this phone.';
      openArea(AREA.code, AREA.ok);
    })
    .postTruck(payload);
}

}
var ddateTimer=null;
function ddateSettled(){
  if(ddateTimer){ clearTimeout(ddateTimer); ddateTimer=null; }
  if(!DAY) return;
  DAY.loaded=false; openDay(); loadDay2();
}

/** Bring back whatever is already saved for the day, so it can be adjusted. */
function loadDay2(){
  if(!DAY||!DAY.date) return;
  var d=DAY.date;
  google.script.run.withSuccessHandler(function(res){
    if(!DAY||DAY.date!==d||!res||!res.ok) return;
    DAY.start=res.start||''; DAY.finish=res.finish||'';
    DAY.barrierStart=res.barrierStart||''; DAY.barrierFinish=res.barrierFinish||'';
    DAY.lot=res.lot||'';
    openDay();
  }).withFailureHandler(function(){}).dayDetails(d, CODE);
}

function saveDay(){
  if(DAY.busy || !DAY.date) return;
  DAY.busy=true; openDay();
  var payload={code_:CODE, date:DAY.date, start:DAY.start, finish:DAY.finish,
               barrierStart:DAY.barrierStart, barrierFinish:DAY.barrierFinish, lot:DAY.lot};
  google.script.run.withSuccessHandler(function(res){
    DAY.busy=false;
    if(!res||!res.ok){ DAY.err=(res&&res.message)||'Could not save.'; openDay(); return; }
    DAY.ok='Saved'+(res.saved?' \u2014 '+res.saved:'')+'.';
    openDay();
  }).withFailureHandler(function(){
    DAY.busy=false;
    enqueue('saveDayDetails', payload, 'day details '+DAY.date);
    DAY.ok='Held on this phone.';
    openDay();
  }).saveDayDetails(payload);
}

/* -------------------------------------------------------------- tack coat
   Not measured on its own: it is sprayed over whatever was paved, so the
   area comes from the day's paving and the litres follow from it.          */

var TACK = null;

function openTack(keepMsg){
  SCREEN='tack';
  var it=byCode('05.02.02');
  if(!TACK) TACK={date:DATA.today, site:'', litres:'', area:0, lines:[],
                  rate:0.26, already:0, loaded:false, asked:false, err:'', ok:''};
  TACK.ok=keepMsg||'';
  document.getElementById('back').style.display='block';
  document.getElementById('back').onclick=function(){ TACK=null; renderHome(); };
  document.getElementById('title').textContent=it?it.name:'Tack Coat';
  var a=document.getElementById('act'); a.textContent=''; a.onclick=null;

  var h='';
  if(TACK.ok) h+='<div class="ok">'+esc(TACK.ok)+'</div>';
  if(TACK.err) h+='<div class="err">'+esc(TACK.err)+'</div>';

  h+='<div class="fld"><label>Date</label><input type="date" value="'+esc(TACK.date)+'" '+
     'onchange="kdateChanged(this.value)" onblur="kdateSettled()"></div>';
  h+='<div class="fld"><label>Job site</label>'+
     '<select onchange="kset(\'site\',this.value)"><option value="">Choose…</option>';
  DATA.sites.forEach(function(sv){
    h+='<option value="'+esc(sv)+'"'+(TACK.site===sv?' selected':'')+'>'+esc(sv)+'</option>';
  });
  h+='</select></div>';

  if(TACK.date && TACK.site && TACK.loaded){
    if(TACK.area>0){
      h+='<div class="grp" style="margin-top:16px">Paved that day  \u00b7  '+
         Math.round(TACK.area).toLocaleString()+' m²</div><div class="pts">';
      TACK.lines.forEach(function(l){
        h+='<div class="pt"><div class="txt" style="flex:1;min-width:0">'+
           '<div style="font-weight:600">'+esc(l.what)+'</div></div>'+
           '<div class="a">'+Math.round(l.area).toLocaleString()+' m²</div></div>';
      });
      h+='</div>';
      h+='<div class="calc"><div class="lab">At '+TACK.rate+' L/m²</div>'+
         '<div class="val">'+Number(TACK.litres||0).toLocaleString(undefined,
           {maximumFractionDigits:1})+' L</div>'+
         '<div class="sub">'+Math.round(TACK.area).toLocaleString()+' m² × '+TACK.rate+
         '</div></div>';
      h+='<div class="fld"><label>Litres applied</label>'+
         '<input type="number" inputmode="decimal" step="0.01" value="'+esc(TACK.litres)+'" '+
         'oninput="kfield(\'litres\',this.value)"></div>';
      h+='<div class="note" style="margin-bottom:10px">The figure above is what the '+
         'area calls for. Change it if what went down was different.</div>';
      if(TACK.already>0)
        h+='<div class="note" style="margin-bottom:10px;background:#fdf0d5;color:#8a5200">'+
           Number(TACK.already).toLocaleString()+' L is already recorded for this day. '+
           'Saving replaces it.</div>';
      h+= Number(TACK.litres)>0
        ? '<button class="btn save" onclick="saveTack()">Save to '+
          esc(shortDate(TACK.date))+'</button>'
        : '<button class="btn off">Save</button>';
    }else{
      h+='<div class="note" style="margin-top:14px">Nothing has been paved at '+
         esc(TACK.site)+' on that day yet, so there is no area to spray over. '+
         'Enter the paving first.</div>';
    }
  }
  h+='<button class="btn ghost" onclick="TACK=null;renderHome()">Done</button>';
  document.getElementById('view').innerHTML=h;
  if(TACK.date && TACK.site && !TACK.asked){ TACK.asked=true; loadTack(); }
  armCamera('05.02.02', TACK.date, TACK.site, '', '', '');
}

var kdateTimer=null;
function kdateChanged(v){
  if(!TACK) return;
  TACK.date=v; TACK.err=''; TACK.loaded=false;
  if(kdateTimer) clearTimeout(kdateTimer);
  kdateTimer=setTimeout(kdateSettled, 600);
}
function kdateSettled(){
  if(kdateTimer){ clearTimeout(kdateTimer); kdateTimer=null; }
  if(!TACK) return;
  openTack(TACK.ok); loadTack();
}

function kset(k,v){
  TACK[k]=v; TACK.err=''; TACK.loaded=false;
  openTack(TACK.ok); loadTack();
}
function kfield(k,v){ TACK[k]=v; openTack(TACK.ok); }

function loadTack(){
  if(!TACK||!TACK.date||!TACK.site) return;
  var d=TACK.date, st=TACK.site;
  google.script.run.withSuccessHandler(function(res){
    if(!TACK||TACK.date!==d||TACK.site!==st) return;
    if(res&&res.ok){
      TACK.area=res.area||0; TACK.lines=res.lines||[]; TACK.rate=res.rate||0.26;
      TACK.already=res.already||0;
      if(TACK.litres==='') TACK.litres=String(res.litres||'');
    }
    TACK.loaded=true; openTack(TACK.ok);
  }).withFailureHandler(function(){
    TACK.err='Could not read the day\'s paving.'; TACK.loaded=true; openTack();
  }).tackForDay(d, st, CODE);
}

function saveTack(){
  var payload={code_:CODE, date:TACK.date, site:TACK.site,
               litres:TACK.litres, area:TACK.area};
  google.script.run
    .withSuccessHandler(function(res){
      if(!res.ok){ TACK.err=res.message; openTack(); return; }
      if(res.item){
        for(var i=0;i<DATA.items.length;i++)
          if(DATA.items[i].code==='05.02.02'){ DATA.items[i]=res.item; break; }
      }
      TACK.already=res.litres;
      openTack('Saved '+res.litres.toLocaleString()+' L — '+res.loc);
    })
    .withFailureHandler(function(){
      enqueue('postTack', payload, 'tack coat '+payload.litres+' L');
      openTack('Held on this phone — it will be sent when there is signal.');
    })
    .postTack(payload);
}

/**
 * How far the tonnage left will reach at the rate being run.
 *
 * Paving is paid by the tonne against a fixed quantity, so a high rate earns
 * sooner but covers less road. This is the number that says whether holding
 * the top of the bonus band will still see the job finished.
 */
var COVER = {};

function loadCoverage(code){
  if(COVER[code]!==undefined) return;
  COVER[code]=null;
  google.script.run.withSuccessHandler(function(c){
    COVER[code]=c||null;
    if(SCREEN==='item'&&CURRENT===code) openItem(code);
  }).withFailureHandler(function(){}).coverage({code:code, code_:CODE});
}

function coverHtml(code){
  var c=COVER[code];
  if(!c||!c.rate||!c.reach) return '';
  return '<div class="calc" style="margin-top:14px">'+
    '<div class="lab">What is left will cover</div>'+
    '<div class="val">'+c.reach.toLocaleString()+'<small> m²</small></div>'+
    '<div class="sub">'+Math.round(c.left).toLocaleString()+' t remaining at '+
    c.rate.toFixed(1)+' kg/m², the rate run so far'+
    (c.perLift?'<br>area of lift laid, not length of road \u2014 this line paves '+
      'the same ground more than once':'')+'</div></div>';
}

function openArea(code, keepMsg){
  SCREEN='area'; CURRENT=code;
  var it=byCode(code);
  if(!AREA || AREA.code!==code){
    var d = DRAFTS[code];
    AREA = d
      ? {code:code, date:d.date, site:d.site, dir:d.dir, lane:d.lane||'',
         segs:d.segs||[], mode:'sta', twoW:!!d.twoW, anchored:!!d.anchored, confirmDrop:-1,
         s1:d.s1||'', w1:d.w1||'', s2:'', w2:d.w2||'',
         darea:'', dnote:'', tonnes:d.tonnes||'', at:'', atw:'',
         endT:'', endD:'', hasLeft:false,
         dayArea:0, dayTonnes:0, daySegs:[], err:'', ok:''}
      : {code:code, date:'',
         site:(it.sites&&it.sites.length===1)?it.sites[0]:'',
         dir:'', lane:'', segs:[], mode:'sta', twoW:false, anchored:false, confirmDrop:-1,
         s1:'', w1:'', s2:'', w2:'', darea:'', dnote:'',
         tonnes:'', segT:'', lift:'', at:'', atw:'', confirming:false,
         endT:'', endD:'', hasLeft:false, endAt:'', endW:'', closed:null, closedArea:0,
         dayArea:0, dayTonnes:0, daySegs:[], err:'', ok:''};
  }
  AREA.ok = keepMsg||'';
  document.getElementById('back').style.display='block';
  document.getElementById('back').onclick=function(){ AREA=null; openItem(code); };
  document.getElementById('title').textContent=it.name;
  var a=document.getElementById('act'); a.textContent=''; a.onclick=null;

  if(AREA.showCtx===undefined) AREA.showCtx=!ctxDone();
  var h='';
  // only a rated item needs the estimator; level course just needs its tonnage
  h+= it.rated ? '<div id="a_bar">'+barHtml(it)+'</div>' : headHtml(it);
  if(AREA.ok) h+='<div class="ok">'+esc(AREA.ok)+'</div>';
  if(AREA.err) h+='<div class="err">'+esc(AREA.err)+'</div>';
  h+=lastLine(it);

  if(AREA.showCtx){
    h+='<div class="fld"><label>Date</label><input type="date" value="'+esc(AREA.date)+'" '+
       'onchange="dateChanged(this.value)" onblur="dateSettled()"></div>';
    h+=siteField(it, AREA.site, 'aset');
    h+=dirField(AREA.site, AREA.dir, 'aset');
    h+=laneField(AREA.lane,'aset');
  h+=liftField(it, AREA.lift, 'aset');
  }

  if(!ready()){
    /* the header already says what is missing */
  }else if(AREA.mode==='desc'){
    h+='<div class="fld"><label>Area (m²)</label>'+
       '<input type="number" inputmode="decimal" step="0.1" value="'+esc(AREA.darea)+'" '+
       'placeholder="420" oninput="afield(\'darea\',this.value)"></div>';
    h+='<div class="fld"><label>Where</label>'+
       '<input type="text" value="'+esc(AREA.dnote)+'" '+
       'placeholder="Intersection at Brodie approach" oninput="afield(\'dnote\',this.value)"></div>';
    if(it.segTonnes){
      h+='<div class="fld"><label>Tonnes on this one'+
         (it.blockOptional?' <span class="muted">(for the running rate)</span>':'')+'</label>'+
         '<input type="number" inputmode="decimal" step="0.01" value="'+esc(AREA.segT)+'" '+
         'placeholder="'+(it.blockOptional?'off the tickets, if known':'what went in here')+'" '+
         'oninput="afield(\'segT\',this.value)"></div>';
      h+='<div id="a_seg">'+segRateHtml(it)+'</div>';
    }
    h+='<div id="a_btn">'+buttonHtml()+'</div>';
    h+='<div style="text-align:center;margin:10px 0"><span class="muted" '+
       'style="text-decoration:underline" onclick="aset(\'mode\',\'sta\')">'+
       'measure by stations instead</span></div>';
  }else if(!AREA.anchored && AREA.segs.length===0){
    // Where the day's run begins. Set once; it becomes the first segment's
    // from-station, and every stretch after carries on from the one before,
    // so the start is entered a single time and cannot disagree with itself.
    h+='<div class="fld"><label>Start station \u2014 where today\u2019s run begins</label>'+
       '<input type="number" inputmode="numeric" id="g_anchor" value="'+esc(AREA.s1)+'" '+
       'placeholder="e.g. 54730" oninput="afield(\'s1\',this.value)"></div>';
    h+='<div id="a_anchor">'+anchorBtnHtml()+'</div>';
    h+='<div class="note">You enter this once. Each stretch after picks up where '+
       'the last one ended.</div>';
  }else{
    // The block model: from station, to station, one width between them.
    // Two widths are there for a genuinely tapered stretch, but the common
    // case is a single width, so that is the default.
    if(AREA.twoW){
      h+='<div class="two">'+
         '<div class="fld"><label>From station</label>'+
         '<input type="number" inputmode="numeric" id="g_s1" value="'+esc(AREA.s1)+'" '+
         'placeholder="11800" oninput="afield(\'s1\',this.value)"></div>'+
         '<div class="fld"><label>Width there (m)</label>'+
         '<input type="number" inputmode="decimal" step="0.01" id="g_w1" value="'+esc(AREA.w1)+'" '+
         'placeholder="9.00" oninput="afield(\'w1\',this.value)"></div></div>';
      h+='<div class="two">'+
         '<div class="fld"><label>To station</label>'+
         '<input type="number" inputmode="numeric" id="g_s2" value="'+esc(AREA.s2)+'" '+
         'placeholder="13200" oninput="afield(\'s2\',this.value)"></div>'+
         '<div class="fld"><label>Width there (m)</label>'+
         '<input type="number" inputmode="decimal" step="0.01" id="g_w2" value="'+esc(AREA.w2)+'" '+
         'placeholder="9.00" oninput="afield(\'w2\',this.value)"></div></div>';
      h+='<div style="text-align:center;margin:6px 0"><span class="muted" '+
         'style="text-decoration:underline" onclick="aset(\'twoW\',false)">'+
         'same width throughout</span></div>';
    }else{
      var fromLabel = (AREA.anchored || AREA.segs.length)
        ? 'From station \u00b7 continuing' : 'From station';
      h+='<div class="two">'+
         '<div class="fld"><label>'+fromLabel+'</label>'+
         '<input type="number" inputmode="numeric" id="g_s1" value="'+esc(AREA.s1)+'" '+
         'placeholder="11800" oninput="afield(\'s1\',this.value)"></div>'+
         '<div class="fld"><label>To station</label>'+
         '<input type="number" inputmode="numeric" id="g_s2" value="'+esc(AREA.s2)+'" '+
         'placeholder="13200" oninput="afield(\'s2\',this.value)"></div></div>';
      h+='<div class="fld"><label>Width between them (m)</label>'+
         '<input type="number" inputmode="decimal" step="0.01" id="g_w1" value="'+esc(AREA.w1)+'" '+
         'placeholder="9.00" oninput="afield(\'w1\',this.value)"></div>';
      h+='<div style="text-align:center;margin:6px 0"><span class="muted" '+
         'style="text-decoration:underline" onclick="aset(\'twoW\',true)">'+
         'different widths at each end</span></div>';
    }
    if(it.segTonnes){
      h+='<div class="fld"><label>Tonnes on this one'+
         (it.blockOptional?' <span class="muted">(for the running rate)</span>':'')+'</label>'+
         '<input type="number" inputmode="decimal" step="0.01" value="'+esc(AREA.segT)+'" '+
         'placeholder="'+(it.blockOptional?'off the tickets, if known':'what went in here')+'" '+
         'oninput="afield(\'segT\',this.value)"></div>';
      h+='<div id="a_seg">'+segRateHtml(it)+'</div>';
    }
    h+='<div id="a_clash">'+clashHtml()+'</div>';
    h+='<div id="a_btn">'+buttonHtml()+'</div>';
    h+='<div style="text-align:center;margin:10px 0"><span class="muted" '+
       'style="text-decoration:underline" onclick="aset(\'mode\',\'desc\')">'+
       'an area with no stations</span></div>';
  }

  if(ready()) h+=shotsHtml();

  // a truck can be recorded from here without leaving the measurement in hand
  if(ready() && it.paving){
    h+='<div style="text-align:center;margin:10px 0"><span class="muted" '+
       'style="text-decoration:underline" onclick="openTruckModal()">'+
       'record a truck</span>';
    // the forecast reads this lane's blocks, so it only makes sense on rated lifts
    if(it.rated) h+='<span class="muted" style="margin:0 8px">\u00b7</span>'+
       '<span class="muted" style="text-decoration:underline" onclick="openForecast()">'+
       'forecast</span>';
    h+='</div>';
  }

  if(ready() && (AREA.daySegs||[]).length){
    h+='<div class="grp" style="margin-top:16px">Today so far</div>';
    h+='<div class="pts">';
    // newest at the top: the last thing done is the first thing you want to see
    AREA.daySegs.slice().reverse().forEach(function(g){
      h+='<div class="pt" style="opacity:.72">'+
         '<div class="txt" style="flex:1;min-width:0">'+
         (g.kind==='desc'
           ? '<div style="font-weight:600">Area without stations</div>'
           : '<div style="font-weight:600">'+esc(staTxt(g.s1))+' → '+esc(staTxt(g.s2))+'</div>'+
             '<div style="font-size:12px;color:var(--grey)">'+esc(g.dir||'')+
             (g.lane?' · '+esc(g.lane):'')+' · '+Number(g.w1).toFixed(2)+
             (g.w2!==g.w1?' / '+Number(g.w2).toFixed(2):'')+' m</div>')+
         '</div>'+
         '<div class="a">'+Number(g.area).toLocaleString(undefined,{maximumFractionDigits:1})+
         ' m²</div></div>';
    });
    h+='</div>';
  }

  if(AREA.segs.length){
    h+='<div class="grp" style="margin-top:16px">Ready to save  ·  '+
       areaTotal().toLocaleString(undefined,{maximumFractionDigits:1})+' m²</div>';
    h+='<div class="pts">';
    // newest at the top, matching the saved list below it
    for(var i=AREA.segs.length-1;i>=0;i--){
      var g=AREA.segs[i];
      var confirming = (AREA.confirmDrop===i);
      h+='<div class="pt"><div class="n">'+(i+1)+'</div>'+
         '<div class="txt" style="flex:1;min-width:0" onclick="editSeg('+i+')">'+
         (g.kind==='desc'
           ? '<div style="font-weight:600">'+esc(g.note)+'</div>'+
             '<div style="font-size:12px;color:var(--grey)">no stations · tap to change</div>'
           : '<div style="font-weight:600">'+esc(staTxt(g.s1))+' → '+esc(staTxt(g.s2))+'</div>'+
             '<div style="font-size:12px;color:var(--grey)">'+
             Number(g.w1).toFixed(2)+' / '+Number(g.w2).toFixed(2)+' m · '+
             Math.abs(g.s2-g.s1).toLocaleString()+' m'+
             (g.tonnes?' · '+g.tonnes.toLocaleString()+' t':'')+' · tap to change</div>')+'</div>'+
         '<div class="a">'+g.area.toLocaleString(undefined,{maximumFractionDigits:1})+' m²</div>'+
         (confirming
           ? '<div class="x" style="color:var(--red);font-weight:700;font-size:13px" '+
             'onclick="dropSeg('+i+')">remove?</div>'
           : '<div class="x" onclick="askDropSeg('+i+')">&times;</div>')+'</div>';
    }
    h+='</div>';
    h+= ready() ? '<button class="btn save" onclick="submitArea()">Save to '+
       esc(shortDate(AREA.date))+'</button>'
       : '<button class="btn off">Save</button>';
  }
  if(it.paving && it.closesFromBlocks && ready()){
    h+='<div class="note" style="margin-top:16px">Each measurement is saved with its '+
       'own tonnage, so there is nothing further to do at the end of the day.</div>';
  }

  // the day close shows for paving items that do NOT close from their blocks
  // (the top lifts: their blocks carry a working tonnage, but the day still
  // closes on the entered Delivered / Placed figure)
  if(it.paving && !it.closesFromBlocks && ready() && (AREA.dayArea>0 || AREA.segs.length)){
    h+='<div class="grp" style="margin-top:18px">Tonnage for the day</div>';
    if(AREA.confirming){
      h+=confirmHtml(it);
      h+='<button class="btn go" onclick="finishDay()">Yes, save it</button>';
      h+='<button class="btn ghost" onclick="aset(\'confirming\',false)">Not yet</button>';
    }else{
      if(AREA.closed!==null){
        var moved = Math.abs((AREA.dayArea||0)-(AREA.closedArea||0))>0.5 || AREA.segs.length;
        h+='<div class="note" style="margin-bottom:10px;'+
           (moved?'background:#fdecea;color:var(--red)':'')+'">'+
           'The day is already saved at <b>'+
           Number(AREA.closed).toLocaleString()+' t</b>.'+
           (moved ? ' Area has been measured since, so that tonnage no longer matches. '+
                    'Save it again with the full figure.'
                  : ' Saving again replaces that figure.')+
           '</div>';
      }
      // Delivered is the tickets total. Placed is what went down and drives the
      // rate; if nothing is left over, Placed equals Delivered and only this one
      // field is needed. The "some was left over" line opens the split.
      h+='<div class="fld"><label>Delivered \u2014 total off the tickets</label>'+
         '<input type="number" inputmode="decimal" step="0.01" value="'+esc(AREA.endD)+'" '+
         'placeholder="off the tickets" oninput="afield(\'endD\',this.value)"></div>';
      if(!AREA.hasLeft){
        h+='<div style="text-align:center;margin:4px 0 10px"><span class="muted" '+
           'style="text-decoration:underline" onclick="aset(\'hasLeft\',true)">'+
           'some was left over</span></div>';
      }else{
        h+='<div class="fld"><label>Placed \u2014 what went down</label>'+
           '<input type="number" inputmode="decimal" step="0.01" value="'+esc(AREA.endT)+'" '+
           'placeholder="tonnes onto the road" oninput="afield(\'endT\',this.value)"></div>';
        h+='<div id="a_left">'+leftoverHtml()+'</div>';
        h+='<div style="text-align:center;margin:4px 0 10px"><span class="muted" '+
           'style="text-decoration:underline" onclick="aset(\'hasLeft\',false)">'+
           'no left over \u2014 all of it was placed</span></div>';
      }
      h+='<div class="two">'+
         '<div class="fld"><label>Stopped at station</label>'+
         '<input type="number" inputmode="numeric" value="'+esc(AREA.endAt)+'" '+
         'placeholder="optional" oninput="afield(\'endAt\',this.value)"></div>'+
         '<div class="fld"><label>Width there (m)</label>'+
         '<input type="number" inputmode="decimal" step="0.01" value="'+esc(AREA.endW)+'" '+
         'placeholder="m" oninput="afield(\'endW\',this.value)"></div></div>';
      h+='<div id="a_end">'+endRateHtml(it)+'</div>';
      // its own slot, or typing the tonnage would never bring the button to life
      h+='<div id="a_endbtn">'+endBtnHtml()+'</div>';
    }
  }
  h+='<button class="btn ghost" onclick="AREA=null;openItem(\''+code+'\')">Done</button>';
  document.getElementById('view').innerHTML=h;
  stickBelowBar();
  armCamera(code, AREA.date, AREA.site, AREA.dir, AREA.lane, areaWhere());
}

var dateTimer=null;

/**
 * The iPhone date wheel fires while it is still spinning. Acting on every one
 * of those redraws the screen under the picker, so wait until it settles.
 */
function dateChanged(v){
  AREA.date=v; AREA.err='';
  if(dateTimer) clearTimeout(dateTimer);
  dateTimer=setTimeout(dateSettled, 600);
}

function dateSettled(){
  if(dateTimer){ clearTimeout(dateTimer); dateTimer=null; }
  if(!AREA) return;
  if(ctxDone()) AREA.showCtx=false;
  keepDraft();
  openArea(AREA.code, AREA.ok);
  loadDay();
}

function aset(k,v){
  // Everything not yet saved goes in under one direction and lane, so those
  // cannot change underneath it without misfiling the work.
  if((k==='dir'||k==='lane'||k==='lift') && AREA.segs.length && AREA[k]!==v){
    AREA.err='Save the '+AREA.segs.length+' measurement'+(AREA.segs.length===1?'':'s')+
             ' below first \u2014 they were taken in '+(AREA.dir||'')+' '+(AREA.lane||'')+'.';
    openArea(AREA.code, AREA.ok);
    return;
  }
  AREA[k]=v; AREA.err='';
  if(k==='hasLeft'){
    if(v){ if(AREA.endT==='') AREA.endT=AREA.endD; }   // start from delivered, edit down
    else { AREA.endT=AREA.endD; }                       // closed: placed = delivered
  }
  if(ctxDone()) AREA.showCtx=false;   // fold away once it is all chosen
  keepDraft(); openArea(AREA.code, AREA.ok);
  if(k==='date'||k==='site') loadDay();
}

/** Holds what has been entered but not yet saved, so you can move between
    items through the day and confirm each one when it suits. */
function keepDraft(){
  if(!AREA) return;
  // a set anchor is worth keeping even before the first stretch is measured,
  // so leaving and coming back does not lose where the day began
  if(AREA.segs.length===0 && !AREA.anchored){ delete DRAFTS[AREA.code]; }
  else DRAFTS[AREA.code] = {anchored:AREA.anchored, date:AREA.date, site:AREA.site, dir:AREA.dir, lane:AREA.lane,
                            mode:AREA.mode, tonnes:AREA.tonnes,
                            segs:AREA.segs, s1:AREA.s1, w1:AREA.w1, w2:AREA.w2};
  saveDrafts();
}

function buttonHtml(){
  var prev=segPreview();
  // the only place this measurement is described, so it carries the reason too
  if(prev.ok)
    return '<button class="btn go" onclick="addSeg()">Add '+prev.area+
           '<span class="sub">'+esc(prev.note||'')+'</span></button>';
  return '<button class="btn off">'+(prev.area||'Confirm measurement')+
         (prev.why?'<span class="sub">'+esc(prev.why)+'</span>':'')+'</button>';
}

/* Updates only the preview and the button, so typing never redraws the screen
   and the cursor stays where it is. */
function afield(k,v){
  AREA[k]=v;

  // destroy whichever field is being typed into and drop the keyboard.
  var c=document.getElementById('a_clash'); if(c) c.innerHTML=clashHtml();
  var g=document.getElementById('a_seg');
  if(g){ var itg=byCode(AREA.code); if(itg) g.innerHTML=segRateHtml(itg); }
  if(k==='endD' && !AREA.hasLeft) AREA.endT=AREA.endD;   // no split: placed = delivered
  var lv=document.getElementById('a_left'); if(lv) lv.innerHTML=leftoverHtml();

  if(k==='tonnes'||k==='segT'||k==='at'||k==='atw'||
     k==='endT'||k==='endAt'||k==='endW') keepDraft();

/** Job A runs northbound only, so nothing else is offered there. */

 * The title bar and the totals bar are both stuck to the top, so the second
 * has to begin where the first ends — otherwise it slides underneath and the

/* ------------------------------------------------------------- photographs
   The camera sits in the header so it costs no room on the screen. It appears
   once a date and job site are chosen, because that is what files the photo. */

var PHOTO = {code:'', date:'', site:'', dir:'', lane:'', where:'', tag:'', n:0, busy:false};

function showCam(on, it){
  var el=document.getElementById('cam');
  if(!el) return;
  el.style.display = on ? 'flex' : 'none';
  el.className = 'cam' + (PHOTO.busy ? ' busy' : '');
  var n=document.getElementById('camN');
  if(n) n.textContent = PHOTO.busy ? '…' : (PHOTO.n ? String(PHOTO.n) : '');
}

function armCamera(code, date, site, dir, lane, where, tag){
  var changed = (PHOTO.code!==code||PHOTO.date!==date||PHOTO.site!==site);
  PHOTO.code=code; PHOTO.date=date; PHOTO.site=site; PHOTO.dir=dir||''; PHOTO.lane=lane||'';
  PHOTO.where=where||''; PHOTO.tag=tag||'';
  var on = !!(code && date && site);
  if(changed && on){
    PHOTO.n=0;
    google.script.run.withSuccessHandler(function(n){
      if(PHOTO.code!==code||PHOTO.date!==date||PHOTO.site!==site) return;
      if((n||0)===PHOTO.n) return;        // nothing to change, so nothing moves
      PHOTO.n=n||0; showCam(true);
    }).withFailureHandler(function(){}).photoCount(code,date,site,CODE);
  }
  showCam(on);
}

function takePhoto(){
  if(PHOTO.busy) return;
  var el=document.getElementById('camIn');
  if(el){ el.value=''; el.click(); }
}

/** Shrunk before sending: a report page needs nothing like a full camera frame. */
function photoPicked(input){
  var file = input.files && input.files[0];
  if(!file) return;
  var target = (input.getAttribute && input.getAttribute('data-for')) || '';
  var forTruck = target==='truck';
  var forModal = target==='tmod';
  if(input.setAttribute) input.setAttribute('data-for','');
  if(!forTruck && !forModal){ PHOTO.busy=true; showCam(true); }
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var max=1200, w=img.width, h=img.height;
      if(w>max||h>max){ var k=Math.min(max/w,max/h); w=Math.round(w*k); h=Math.round(h*k); }
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      var out = cv.toDataURL('image/jpeg',0.72);
      if(forModal) tmSend(out); else if(forTruck) sendTruck(out); else sendPhoto(out);
    };
    img.onerror=function(){ PHOTO.busy=false; showCam(true); };
    img.src=ev.target.result;
  };
  reader.onerror=function(){ PHOTO.busy=false; showCam(true); };
  reader.readAsDataURL(file);
}

function sendPhoto(data){
  if(!queueRoom(data.length)){
    PHOTO.busy=false; showCam(true);
    alert('This phone is holding as many photographs as it can. '+
          'Find signal and let them send before taking more.');
    return;
  }
  var ppayload=null;
  google.script.run
    .withSuccessHandler(function(res){
      PHOTO.busy=false;
      if(res&&res.ok){ PHOTO.n=res.count||PHOTO.n+1; SHOTS.key=''; if(SHOTS.open) loadShots(); }
      showCam(true); redrawScreen();
    })
    .withFailureHandler(function(){
      PHOTO.busy=false;
      enqueue('postPhoto', ppayload, 'photograph \u2014 '+PHOTO.code);
      PHOTO.n++; showCam(true);
    })
    .postPhoto(ppayload={code_:CODE, code:PHOTO.code, date:PHOTO.date, site:PHOTO.site,
                dir:PHOTO.dir, lane:PHOTO.lane, note:PHOTO.where, tag:PHOTO.tag,
                data:data});
}

/**
 * The photographs already taken here, with a way to bin one.
 * A better angle turns up often enough that replacing a shot has to be easy.
 */
var SHOTS = { key:'', list:[], open:false };

function shotsKey(){ return PHOTO.code+'|'+PHOTO.date+'|'+PHOTO.site; }

function loadShots(){
  if(!PHOTO.code||!PHOTO.date||!PHOTO.site) return;

    if(shotsKey()!==k) return;
    SHOTS.key=k; SHOTS.list=list||[]; PHOTO.n=SHOTS.list.length;
    showCam(true); redrawScreen();
  }).withFailureHandler(function(){}).photosFor({code:PHOTO.code, date:PHOTO.date,
    site:PHOTO.site, code_:CODE});

function shotsHtml(){
  if(!PHOTO.code||!PHOTO.date||!PHOTO.site) return '';
  var n=PHOTO.n||0;

        '<button class="btn ghost" onclick="toggleShots()">'+
        (SHOTS.open?'Hide them':'Show them')+'</button>';
  if(!SHOTS.open) return h;
  var mine = (SHOTS.key===shotsKey()) ? SHOTS.list : [];
  if(!mine.length) return h+'<div class="note">'+
    (SHOTS.key===shotsKey()?'None taken here yet.':'Loading\u2026')+'</div>';
  h+='<div class="pts">';

       '<div style="font-weight:600;font-size:13px">'+esc(f.when)+'</div>'+
       '<div style="font-size:11px;color:var(--grey);overflow:hidden;'+
       'text-overflow:ellipsis;white-space:nowrap">'+esc(f.name)+'</div></div>'+

function binShot(id){
