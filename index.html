/**
 * What the rate would be right now.
 *
 * Work in other lanes counts in full. The lane being worked is taken only as
 * far as the station asked about: back along the chain if it is behind, or
 * carried on at the last width if it is ahead of the last measurement.
 */
function estimate(it){
  var segs = (AREA.daySegs||[]).concat(
    AREA.segs.map(function(g){
      return g.kind==='desc'
        ? {kind:'desc', area:g.area}
        : {kind:'sta', dir:AREA.dir, lane:AREA.lane, s1:g.s1, s2:g.s2, w1:g.w1, w2:g.w2, area:g.area};
    }));
  var at = (AREA.at===''||AREA.at===null||!isFinite(Number(AREA.at))) ? null : Number(AREA.at);

  var area = 0, cur = [];
  segs.forEach(function(g){
    if(g.kind!=='sta'){ area += g.area; return; }
    if(at!==null && g.dir===AREA.dir && g.lane===AREA.lane) cur.push(g);
    else area += g.area;
  });

  if(at!==null && cur.length){
    var rising = cur[cur.length-1].s2 >= cur[0].s1;
    for(var i=0;i<cur.length;i++){
      var g=cur[i], lo=Math.min(g.s1,g.s2), hi=Math.max(g.s1,g.s2);
      var past = rising ? (at>=hi) : (at<=lo);
      var before = rising ? (at<=lo) : (at>=hi);
      if(past){ area += g.area; }
      else if(before){ /* not reached */ }
      else {
        var done = rising ? (at-lo) : (hi-at);
        var full = hi-lo;
        area += full>0 ? g.area*(done/full) : 0;   // part way through
      }
    }
    var last = cur[cur.length-1];
    var end = last.s2;
    var beyond = rising ? (at>end) : (at<end);
    if(beyond){
      // carried on past the last measurement, at the width given
      var w = (AREA.atw!==''&&isFinite(Number(AREA.atw))&&Number(AREA.atw)>0)
        ? Number(AREA.atw) : last.w2;
      area += Math.abs(at-end)*(last.w2+w)/2;
    }
  }

  var tonnes = AREA.tonnes!=='' ? Number(AREA.tonnes) : (AREA.dayTonnes||0);
  var rate = (it.rated && area>0 && tonnes>0) ? tonnes*1000/area : null;
  var pct = (rate && DATA.designRate) ? rate/DATA.designRate : null;
  var cls = '';
  if(pct!==null) cls = (pct>=1 && pct<=(DATA.target||1.019)+0.0005) ? 'good' : 'warn';
  return {area:Math.round(area*100)/100, tonnes:tonnes, rate:rate, pct:pct, cls:cls};
}

/** 10:45 am */
function clockTime(){
  var d=new Date(), h=d.getHours(), m=d.getMinutes();
  var ap = h<12 ? 'am' : 'pm';
  h = h%12; if(h===0) h=12;
  return h+':'+('0'+m).slice(-2)+' '+ap;
}

/** The station the figures refer to: the one asked about, or the last measured. */
function atStationText(){
  if(AREA.at!==''&&AREA.at!==null&&isFinite(Number(AREA.at))) return staTxt(Number(AREA.at));
  var cur=(AREA.segs||[]).filter(function(g){return g.kind!=='desc';});
  if(cur.length) return staTxt(cur[cur.length-1].s2);
  var saved=(AREA.daySegs||[]).filter(function(g){
    return g.kind==='sta' && g.dir===AREA.dir && g.lane===AREA.lane;});
  if(saved.length) return staTxt(saved[saved.length-1].s2);
  return '';
}

/**
 * App-Rate check 10:45 am: St 13+200  10,150 m², 1,015t, 83.3% app-rate (100.0 kg/m²)
 */
function rateLine(prefix, station, area, tonnes, rate, designRate){
  var t = prefix+' '+clockTime()+':';
  if(station) t += ' St '+station;
  t += '  '+Math.round(area).toLocaleString()+' m²';
  if(tonnes) t += ', '+tonnes.toLocaleString(undefined,{maximumFractionDigits:1})+'t';
  if(rate){
    if(designRate) t += ', '+(rate/designRate*100).toFixed(1)+'% app-rate';
    t += ' ('+rate.toFixed(1)+' kg/m²)';
  }
  return t;
}

/**
 * What closing the day would do to the measurements, worked out here so it can
 * be shown before anything is changed. Mirrors settleChain_ on the server.
 */
/**
 * What the day comes to as the tonnage is typed — before anything is committed.
 * Waiting until the confirmation card is too late to be useful: the figure is
 * what tells the crew whether the tonnage they have is the tonnage they meant.
 */
function endBtnHtml(){
  return (AREA.endD!=='' && Number(AREA.endD)>0)
    ? '<button class="btn save" onclick="finishDay()">Save to '+
      esc(shortDate(AREA.date))+'</button>'
    : '<button class="btn off">Save</button>';
}

/** The left over figure and a live readout, shown only when the split is open. */
function placedNow_(){
  // when the left-over split is open, Placed is its own field; otherwise all
  // that was delivered was placed
  if(AREA.hasLeft) return AREA.endT==='' ? '' : Number(AREA.endT);
  return AREA.endD==='' ? '' : Number(AREA.endD);
}

function leftoverHtml(){
  var d=Number(AREA.endD), pl=Number(AREA.endT);
  if(!(d>0) || AREA.endT==='') return '<div class="note">Enter what was placed; '+
    'the left over is worked out from it.</div>';
  var left=Math.round((d-pl)*100)/100;
  if(pl>d) return '<div class="note" style="background:#fdecea;color:var(--red)">'+
    'Placed is more than delivered. Check the figures.</div>';
  return '<div class="calc"><div class="lab">Left over (delivered \u2212 placed)</div>'+
    '<div class="val">'+left.toLocaleString(undefined,{maximumFractionDigits:2})+
    '<small> t</small></div></div>';
}

function endRateHtml(it){
  // the rate is worked on what was PLACED; with no split that equals delivered
  var t=Number(placedNow_());
  if(!(t>0)) return '';
  var sp=settlePreview();
  var area=sp.area;
  if(!(area>0)) return '';
  var rate=t*1000/area;
  var pct=DATA.designRate ? rate/DATA.designRate : null;
  var lo=DATA.bandLow||0.96, hi=DATA.bandHigh||1.04;
  var out = pct!==null && (pct<lo || pct>hi);
  var big = (pct!==null) ? (pct*100).toFixed(1)+'<small> %</small>'
                         : rate.toFixed(1)+'<small> kg/m²</small>';
  return '<div class="calc" style="'+(out?'background:#fdecea':'')+'">'+
    '<div class="lab">The day would close at</div>'+
    '<div class="val'+(out?' r':'')+'">'+big+'</div>'+
    '<div class="sub">'+rate.toFixed(1)+' kg/m²  ·  '+
    Math.round(area).toLocaleString()+' m²  ·  '+
    t.toLocaleString(undefined,{maximumFractionDigits:1})+' t'+
    (sp.added?'  ·  including the run to the cut-off':'')+
    (sp.trimmed||sp.removed?'  ·  after taking back past the cut-off':'')+
    (out?'  ·  outside '+(lo*100).toFixed(0)+'\u2013'+(hi*100).toFixed(0)+'%':'')+
    '</div></div>';
}

/** Spelled out in full, because closing the day rewrites saved measurements. */
function confirmHtml(it){
  var sp=settlePreview();
  var delivered=Number(AREA.endD)||0;
  var t=(AREA.hasLeft ? Number(AREA.endT) : delivered)||0;   // placed drives the rate
  var left=Math.round((delivered-t)*100)/100;
  var rate=(it.rated && sp.area>0 && t>0) ? t*1000/sp.area : null;
  var pct=(rate && DATA.designRate) ? rate/DATA.designRate : null;
  var lines=[];
  lines.push('<b>'+esc(ctxLine())+'</b>');
  if(AREA.endAt!=='') lines.push('Stopped at <b>'+esc(staTxt(Number(AREA.endAt)))+
    '</b>, width <b>'+Number(AREA.endW).toFixed(2)+' m</b>');
  if(AREA.hasLeft && left>0){
    lines.push('Delivered <b>'+delivered.toLocaleString(undefined,{maximumFractionDigits:2})+' t</b>');
    lines.push('Placed <b>'+t.toLocaleString(undefined,{maximumFractionDigits:2})+' t</b>'+
      (AREA.closed!==null ? ' <span style="color:var(--red)">(replaces '+
        Number(AREA.closed).toLocaleString()+' t)</span>' : ''));
    lines.push('Left over <b>'+left.toLocaleString(undefined,{maximumFractionDigits:2})+' t</b>');
  } else {
    lines.push('Tonnage <b>'+t.toLocaleString(undefined,{maximumFractionDigits:2})+' t</b>'+
      (AREA.closed!==null ? ' <span style="color:var(--red)">(replaces '+
        Number(AREA.closed).toLocaleString()+' t)</span>' : ''));
  }
  if(sp.added) lines.push('<span style="color:var(--amber)">Adds '+
    Math.round(sp.addedLen).toLocaleString()+' m to the cut-off, '+
    Math.round(sp.gainedArea).toLocaleString()+' m²</span>');
  if(sp.trimmed||sp.removed){
    var bits=[];
    if(sp.trimmed) bits.push(sp.trimmed+' trimmed back');
    if(sp.removed) bits.push(sp.removed+' removed');
    lines.push('<span style="color:var(--red)">Overwrites saved measurements: '+
      bits.join(', ')+', losing '+Math.round(sp.lostArea).toLocaleString()+' m²</span>');
  }
  if(AREA.segs.length) lines.push(AREA.segs.length+' measurement'+
    (AREA.segs.length===1?'':'s')+' still unsaved will NOT be included — save them first');
  lines.push('Area for the day becomes <b>'+Math.round(sp.area).toLocaleString()+' m²</b>');
  if(rate) lines.push('Application rate <b>'+rate.toFixed(1)+' kg/m²</b>'+
    (pct?' · <b>'+(pct*100).toFixed(1)+'%</b> of design':''));
  return '<div class="note" style="margin-bottom:12px;line-height:1.7">'+
         lines.join('<br>')+'</div>';
}

function settlePreview(){
  var at = (AREA.endAt===''||!isFinite(Number(AREA.endAt))) ? null : Number(AREA.endAt);
  var w  = (AREA.endW===''||!isFinite(Number(AREA.endW))) ? null : Number(AREA.endW);
  var out = {added:0, trimmed:0, removed:0, addedLen:0, lostArea:0, gainedArea:0, area:0};

  var all = (AREA.daySegs||[]).concat(AREA.segs.map(function(g){
    return g.kind==='desc' ? {kind:'desc',area:g.area}
      : {kind:'sta',dir:AREA.dir,lane:AREA.lane,s1:g.s1,s2:g.s2,w1:g.w1,w2:g.w2,area:g.area};
  }));
  var cur=[], other=0;
  all.forEach(function(g){
    if(g.kind==='sta' && g.dir===AREA.dir && g.lane===AREA.lane) cur.push(g);
    else other += g.area;
  });
  var kept = cur.reduce(function(a,g){return a+g.area;},0);
  out.area = other + kept;
  if(at===null || w===null || !cur.length) return out;

  var rising = cur[cur.length-1].s2 >= cur[0].s1;
  var past = function(x,y){ return rising ? x>y : x<y; };
  var last = cur[cur.length-1];

  if(past(at,last.s2)){
    var len = Math.abs(at-last.s2);
    var add = Math.round((last.w2+w)/2*len*100)/100;
    out.added=1; out.addedLen=len; out.gainedArea=add;
    out.area = other + kept + add;
    return out;
  }
  var keep = 0;
  cur.forEach(function(g){
    if(!past(g.s1,at) && past(g.s2,at)){
      var len2 = Math.abs(at-g.s1);
      if(len2===0){ out.removed++; return; }
      out.trimmed++;
      keep += Math.round((g.w1+w)/2*len2*100)/100;
    } else if(past(g.s1,at)){
      out.removed++;
    } else {
      keep += g.area;
    }
  });
  out.lostArea = Math.round((kept-keep)*100)/100;
  out.area = other + keep;
  return out;
}

/** Closes the day: where they stopped, at what width, and the tonnage. */
function finishDay(){
  var it=byCode(AREA.code);
  if(!it.paving) return;
  if(AREA.segs.length){
    AREA.err='Save the '+AREA.segs.length+' measurement'+(AREA.segs.length===1?'':'s')+
             ' above first.';
    AREA.confirming=false; openArea(AREA.code, AREA.ok); return; }
  if(!(AREA.dayArea>0)){
    AREA.err='No area has been measured for this day yet. Measure and save first.';
    AREA.confirming=false; openArea(AREA.code, AREA.ok); return; }
  if(AREA.endD===''||!(Number(AREA.endD)>0)){
    AREA.err='Enter the delivered tonnage for the day.';
    openArea(AREA.code, AREA.ok); return; }
  var placedV = AREA.hasLeft ? Number(AREA.endT) : Number(AREA.endD);
  if(AREA.hasLeft && (AREA.endT===''||!(placedV>0))){
    AREA.err='Enter what was placed, or switch off the left-over split.';
    openArea(AREA.code, AREA.ok); return; }
  if(placedV > Number(AREA.endD)+0.005){
    AREA.err='Placed cannot be more than delivered.';
    openArea(AREA.code, AREA.ok); return; }
  if(AREA.endAt!=='' && (AREA.endW===''||!(Number(AREA.endW)>0))){
    AREA.err='Enter the width at the station where they stopped.';
    openArea(AREA.code, AREA.ok); return;
  }
  if(!AREA.confirming){ AREA.confirming=true; AREA.err=''; openArea(AREA.code, AREA.ok); return; }
  AREA.confirming=false;
  document.getElementById('view').innerHTML=
    '<div class="center"><div class="spin"></div>Closing the day…</div>';
  google.script.run
    .withSuccessHandler(function(res){
      if(!res.ok){ AREA.err=res.message; openArea(AREA.code); return; }
      var msg = rateLine('Shift end', AREA.endAt!==''?staTxt(Number(AREA.endAt)):atStationText(),
                         res.dayArea, res.tonnes, res.rated?res.rate:null, res.designRate);
      var st=res.settled||{};
      if(st.added) msg += '  ·  the last stretch to the cut-off was added';
      if(st.trimmed||st.removed) msg += '  ·  measurements past the cut-off were taken back';
      if(res.item){
        for(var i=0;i<DATA.items.length;i++)
          if(DATA.items[i].code===AREA.code){ DATA.items[i]=res.item; break; }
      }
      AREA.dayArea=res.dayArea||0; AREA.dayTonnes=res.tonnes||0;
      AREA.endT=''; AREA.endD=''; AREA.hasLeft=false; AREA.endAt=''; AREA.endW='';
      AREA.err=''; AREA.confirming=false;
      AREA.closed=res.tonnes; AREA.closedArea=res.dayArea||0;
      openArea(AREA.code, msg);
      loadDay();
    })
    .withFailureHandler(function(){
      AREA.err='No signal. The day can only be closed once the measurements have '+
               'been sent \u2014 there are '+queueSize()+' waiting.';
      openArea(AREA.code);
    })
    .postDayTonnage({code_:CODE, code:AREA.code, date:AREA.date, site:AREA.site,
                     dir:AREA.dir, lane:AREA.lane, at:AREA.endAt, width:AREA.endW,
                     delivered:AREA.endD,
                     placed:(AREA.hasLeft ? AREA.endT : AREA.endD),
                     tonnes:(AREA.hasLeft ? AREA.endT : AREA.endD)});
}

function recordEstimate(){
  var it=byCode(AREA.code), est=estimate(it);
  if(!est.rate || AREA.recording) return;
  AREA.recording=true; refreshBar();
  var line = rateLine('App-Rate check', atStationText(), est.area, est.tonnes,
                      est.rate, DATA.designRate);
  google.script.run.withSuccessHandler(function(){
    AREA.recording=false; AREA.ok=line; openArea(AREA.code, AREA.ok);
  }).withFailureHandler(function(){
    AREA.recording=false; AREA.err='Could not record that check.'; openArea(AREA.code);
  }).postEstimate({ note:line, code_:CODE,
    code:AREA.code, date:AREA.date, site:AREA.site, dir:AREA.dir, lane:AREA.lane,
    at:AREA.at, tonnes:est.tonnes, area:est.area, rate:est.rate});
}

function refreshBar(){
  var it=byCode(AREA.code);
  if(!it||!it.rated) return;
  var o=document.getElementById('rp_out');
  if(o){ o.innerHTML=outHtml(it); return; }
  var b=document.getElementById('a_bar');   // first draw only
  if(b) b.innerHTML=barHtml(it);
}

/** Asks the sheet what the day already holds, so the bar starts from the truth. */
function loadDay(){
  if(!AREA||!AREA.date||!AREA.site) return;
  var it=byCode(AREA.code);
  if(!it||it.entry!=='area') return;
  var code=AREA.code, d=AREA.date, st=AREA.site;
  google.script.run.withSuccessHandler(function(res){
    if(!AREA||AREA.code!==code||AREA.date!==d||AREA.site!==st) return;
    if(!res||!res.ok) return;
    // The answer arrives a moment after the screen has already been drawn.
    // Redrawing when nothing has changed makes the screen jump for no reason,
    // so only redraw when the day's figures are actually different.
    var before = [AREA.dayArea, AREA.dayTonnes, (AREA.daySegs||[]).length, AREA.closed].join('|');
    AREA.dayArea=res.area||0; AREA.dayTonnes=res.tonnes||0; AREA.daySegs=res.segs||[];
    AREA.closed=(res.closed===null||res.closed===undefined)?null:res.closed;
    AREA.closedArea=AREA.dayArea;   // the area as it stood when the day was closed
    var after = [AREA.dayArea, AREA.dayTonnes, (AREA.daySegs||[]).length, AREA.closed].join('|');
    if(before!==after) openArea(code, AREA.ok);
  }).withFailureHandler(function(){}).daySoFar(code,d,st,CODE);
}

/** The day, the place and the lane in one line. */
/** What the person is looking at, so a photograph says where it was taken. */
function areaWhere(){
  if(AREA.mode==='desc' && AREA.dnote) return String(AREA.dnote).trim();
  if(AREA.s1!=='' && AREA.s2!=='') return staTxt(Number(AREA.s1))+' to '+staTxt(Number(AREA.s2));
  if(AREA.s1!=='') return 'at '+staTxt(Number(AREA.s1));
  var cur=(AREA.segs||[]).filter(function(g){return g.kind!=='desc';});
  if(cur.length) return 'at '+staTxt(cur[cur.length-1].s2);
  return '';
}

function entryWhere(){
  if(!FORM) return '';
  if(FORM.at!=='' && FORM.at!==undefined && isFinite(Number(FORM.at)))
    return 'at '+staTxt(Number(FORM.at));
  if(FORM.from!=='' && FORM.to!=='')
    return staTxt(Number(FORM.from))+' to '+staTxt(Number(FORM.to));
  if(FORM.from!=='') return 'at '+staTxt(Number(FORM.from));
  if(FORM.loc) return String(FORM.loc).trim();
  return '';
}

/** 14 Aug, the way it is said on site. */
function shortDate(iso){
  if(!iso) return '';
  var d=new Date(iso+'T00:00');
  var mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate()+' '+mon[d.getMonth()];
}

function ctxLine(){
  var bits=[];
  if(AREA.date){
    var d=new Date(AREA.date+'T00:00');
    var mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    bits.push(d.getDate()+' '+mon[d.getMonth()]);   // 13 Aug, not Aug 13
  }
  if(AREA.site) bits.push(AREA.site);
  if(AREA.mode!=='desc'){
    if(AREA.dir) bits.push(AREA.dir);
    if(AREA.lane) bits.push(AREA.lane);
    if(AREA.lift) bits.push(AREA.lift+' lift');
  }
  return bits.join('  ·  ');
}

/** Everything the entry needs before it can begin. */
function ctxDone(){
  if(!AREA || !AREA.date || !AREA.site) return false;
  var it=byCode(AREA.code);
  if(it && it.lifts && it.lifts.length && !AREA.lift) return false;
  return AREA.mode==='desc' ? true : !!AREA.lane;
}

/**
 * Where this item was last left off, whichever day that was. The work runs in
 * sequence, so the first thing anyone wants to know is where it stopped.
 */
function lastLine(it){
  if(!it || !it.lastDate) return '';
  var bits=[it.lastDate];
  if(it.lastSite) bits.push(it.lastSite);
  var right = it.lastLoc ? esc(it.lastLoc)
            : (it.lastQty!==''&&it.lastQty!==null
               ? Number(it.lastQty).toLocaleString()+' '+esc(it.uom||'') : '');
  return '<div class="note" style="margin:-4px 0 12px;font-size:12px">'+
         '<b>Left off:</b> '+esc(bits.join(' · '))+(right?'  ·  '+right:'')+'</div>';
}

function ready(){
  if(!(AREA && AREA.date && AREA.site)) return false;
  var it=byCode(AREA.code);
  if(it && it.lifts && it.lifts.length && !AREA.lift) return false;
  return true;
}

/**
 * The rate this patch implies. Nobody can know what a truck actually dumped
 * into one place, so the figure entered is a judgement — and this is the check
 * on it. The day's rate is an average of these, and it can only be sound if
 * each one was.
 */
function segRate(){
  var it=byCode(AREA.code);
  if(!it || !it.segTonnes) return null;
  var t=Number(AREA.segT);
  if(!(t>0)) return null;
  var s1=Number(AREA.s1), s2=Number(AREA.s2), w1=Number(AREA.w1), w2=Number(AREA.w2);
  var a = (AREA.mode==='desc') ? Number(AREA.darea)
        : (isFinite(s1)&&isFinite(s2)&&isFinite(w1)&&isFinite(w2)&&s1!==s2)
          ? Math.abs(s2-s1)*(w1+w2)/2 : 0;
  if(!(a>0)) return null;
  var rate=t*1000/a;
  var pct=DATA.designRate ? rate/DATA.designRate : null;
  var lo=DATA.bandLow||0.96, hi=DATA.bandHigh||1.04;
  return {area:a, rate:rate, pct:pct,
          out: pct!==null && (pct<lo || pct>hi), lo:lo, hi:hi};
}

function segRateHtml(it){
  var r=segRate();
  if(!r) return '';
  // the crew judge the work in percent, so that is the figure to put in front
  // of them; the kg/m² sits underneath for anyone who wants it
  var big = (r.pct!==null) ? (r.pct*100).toFixed(1)+'<small> %</small>'
                           : r.rate.toFixed(1)+'<small> kg/m²</small>';
  return '<div class="calc" style="'+(r.out?'background:#fdecea':'')+'">'+
    '<div class="lab">This one works out at</div>'+
    '<div class="val'+(r.out?' r':'')+'">'+big+'</div>'+
    '<div class="sub">'+r.rate.toFixed(1)+' kg/m²  ·  '+
    Math.round(r.area).toLocaleString()+' m²'+
    (r.out?'  ·  outside '+(r.lo*100).toFixed(0)+'\u2013'+(r.hi*100).toFixed(0)+
      '%, check the tonnage':'')+'</div></div>';
}

function segPreview(){
  if(!ready()) return {ok:false, why:'Choose the date and job site first'};
  if(AREA.mode==='desc'){
    var a=Number(AREA.darea);
    if(AREA.darea===''||!isFinite(a)||a<=0) return {ok:false, why:'Enter the area'};
    if(!String(AREA.dnote).trim()) return {ok:false, why:'Say where it is'};
    return {ok:true, area:a.toLocaleString(undefined,{maximumFractionDigits:1})+' m²',
            note:String(AREA.dnote).trim()};
  }
  if(!AREA.lane) return {ok:false, why:'Choose a lane'};
  var oneW = !AREA.twoW;
  if(AREA.s1===''||AREA.s2===''||AREA.w1==='') return {ok:false};
  if(!oneW && AREA.w2==='') return {ok:false};
  var itc=byCode(AREA.code);
  if(itc&&itc.segTonnes&&!itc.blockOptional&&!(Number(AREA.segT)>0))
    return {ok:false, why:'Enter the tonnes on this one'};
  var s1=Number(AREA.s1), s2=Number(AREA.s2), w1=Number(AREA.w1);
  var w2=oneW? w1 : Number(AREA.w2);
  if(!isFinite(s1)||!isFinite(s2)||!isFinite(w1)||!isFinite(w2)) return {ok:false};
  if(s1===s2) return {ok:false, why:'Same station twice'};
  if(w1<=0||w2<=0) return {ok:false, why:'Width must be more than zero'};
  var len=Math.abs(s2-s1);
  var area=Math.round((w1+w2)/2*len*100)/100;
  var note=staTxt(s1)+' to '+staTxt(s2)+' · '+len.toLocaleString()+' m · '+
           (oneW ? w1.toFixed(2)+' m wide'
                 : 'avg '+((w1+w2)/2).toFixed(2)+' m');
  var itr=byCode(AREA.code);
  if(overlaps(s1,s2) && !AREA.allowOverlap && !(itr && itr.repeats))
    return {ok:false, why:'Already covered today in this lane', clash:true,
            area:area.toLocaleString(undefined,{maximumFractionDigits:1})+' m²'};
  if(overlaps(s1,s2) && itr && itr.repeats)
    note += '  ·  another run over the same ground';
  return {ok:true, area:area.toLocaleString(undefined,{maximumFractionDigits:1})+' m²',
          note:note};
}

/** True if this stretch has already been measured today in the same lane. */
function overlaps(s1,s2){
  var lo=Math.min(s1,s2), hi=Math.max(s1,s2);
  var all=(AREA.daySegs||[]).filter(function(g){
    return g.kind==='sta' && g.dir===AREA.dir && g.lane===AREA.lane &&
           (g.lift||'')===(AREA.lift||'');
  }).concat(AREA.segs.filter(function(g){ return g.kind!=='desc'; }));
  for(var i=0;i<all.length;i++){
    var a=Math.min(all[i].s1,all[i].s2), b=Math.max(all[i].s1,all[i].s2);
    if(lo < b && hi > a) return true;
  }
  return false;
}

function areaTotal(){
  var t=0;
  AREA.segs.forEach(function(g){ t+=g.area; });
  return Math.round(t*100)/100;
}

function anchorBtnHtml(){
  return (AREA.s1!=='' && isFinite(Number(AREA.s1)))
    ? '<button class="btn save" onclick="setAnchor()">Start here \u2014 '+esc(staTxt(Number(AREA.s1)))+'</button>'
    : '<button class="btn off">Enter the start station</button>';
}

function setAnchor(){
  // fix the day's start; it becomes the first segment's from-station and the
  // chain carries on from there. Editable still, in case a stretch is corrected.
  var v=Number(AREA.s1);
  if(AREA.s1==='' || !isFinite(v)){ AREA.err='Enter the start station.'; openArea(AREA.code, AREA.ok); return; }
  AREA.anchored=true; AREA.err=''; keepDraft(); openArea(AREA.code, AREA.ok);
}


function addSeg(){
  AREA.confirmDrop=-1;   // any new action clears a pending remove
  // the button is inactive unless this passes, so nothing needs saying here
  if(!segPreview().ok) return;
  if(AREA.mode==='desc'){
    AREA.segs.push({kind:'desc', area:Math.round(Number(AREA.darea)*100)/100,
                    note:String(AREA.dnote).trim(),
                    tonnes:AREA.segT===''?null:Number(AREA.segT)});
    AREA.darea=''; AREA.dnote=''; AREA.segT=''; AREA.err='';
    keepDraft(); openArea(AREA.code, AREA.ok);
    return;
  }
  var oneW=!AREA.twoW;
  var s1=Number(AREA.s1), s2=Number(AREA.s2), w1=Number(AREA.w1);
  var w2=oneW? w1 : Number(AREA.w2);
  var len=Math.abs(s2-s1);
  AREA.segs.push({kind:'sta',s1:s1,w1:w1,s2:s2,w2:w2,
                  area:Math.round((w1+w2)/2*len*100)/100,
                  tonnes:AREA.segT===''?null:Number(AREA.segT)});
  AREA.segT='';
  // the next stretch usually carries on from here, at the same width
  AREA.s1=s2; AREA.w1=(oneW? w1 : w2); AREA.s2=''; AREA.w2=(oneW? '' : w2);
  AREA.err=''; AREA.allowOverlap=false;   // one exception, not a standing licence
  keepDraft();
  openArea(AREA.code, AREA.ok);
}

/** First tap on the X asks; the second, now labelled "remove?", does it. */
function askDropSeg(i){ AREA.confirmDrop=i; openArea(AREA.code, AREA.ok); }

function dropSeg(i){ AREA.segs.splice(i,1); AREA.err='';
  AREA.confirmDrop=-1;
  if(AREA.segs.length===0) AREA.anchored=false;   // start fresh if all cleared
  keepDraft(); openArea(AREA.code, AREA.ok); }

/**
 * Correct a staged stretch without losing it. Its values go back into the
 * fields, and it is taken off the list; measuring it again replaces it. The
 * chain still carries, because the from-station is loaded too.
 */
function editSeg(i){
  var g=AREA.segs[i];
  if(!g) return;
  AREA.confirmDrop=-1;
  if(g.kind==='desc'){
    AREA.mode='desc'; AREA.darea=String(g.area); AREA.dnote=g.note||'';
    if(g.tonnes!=null) AREA.segT=String(g.tonnes);
  }else{
    AREA.mode='sta';
    AREA.twoW=(g.w2!==g.w1);
    AREA.s1=String(g.s1); AREA.s2=String(g.s2);
    AREA.w1=String(g.w1); AREA.w2=String(g.w2);
    if(g.tonnes!=null) AREA.segT=String(g.tonnes);
  }
  AREA.segs.splice(i,1);
  AREA.anchored=true;   // editing implies the run has begun
  AREA.err=''; keepDraft(); openArea(AREA.code, 'Correcting a stretch \u2014 change it and save again.');
}

function submitArea(){
  document.getElementById('view').innerHTML=
    '<div class="center"><div class="spin"></div>Saving…<br><span class="muted">a few seconds</span></div>';
  var payload={code:AREA.code, date:AREA.date, site:AREA.site, dir:AREA.dir,
               lane:AREA.lane, lift:AREA.lift, tonnes:AREA.tonnes,
               segments:AREA.segs, code_:CODE};
  var n=AREA.segs.length, ar=areaTotal(), code0=AREA.code;
  google.script.run
    .withSuccessHandler(function(res){
      if(!res.ok){ AREA.err=res.message; AREA.ok=''; openArea(AREA.code); return; }
      if(res.item){
        for(var i=0;i<DATA.items.length;i++){
          if(DATA.items[i].code===AREA.code){ DATA.items[i]=res.item; break; }
        }
      }
      var msg;
      if(res.paving){
        msg = rateLine('Saved', atStationText(), res.dayArea||0, res.tonnes,
                       res.rated ? res.rate : null, res.designRate);
      }else{
        msg = 'Saved '+res.runArea.toLocaleString(undefined,{maximumFractionDigits:1})+
              ' m². The day now stands at '+
              res.dayTotal.toLocaleString(undefined,{maximumFractionDigits:1})+' m².';
      }
      if(AREA.closed!==null)
        msg += '  \u2014 this day was closed at '+Number(AREA.closed).toLocaleString()+
               ' t, so close it again with the full tonnage.';
      if(res.dayArea!==undefined) AREA.dayArea=res.dayArea||0;
      if(res.tonnes!==null&&res.tonnes!==undefined) AREA.dayTonnes=res.tonnes||0;
      if(res.note) msg+='  ('+res.note+')';
      var code=AREA.code;
      AREA.segs=[]; AREA.s2=''; AREA.darea=''; AREA.dnote=''; AREA.err='';
      delete DRAFTS[code]; saveDrafts();
      openArea(code, msg);
      // what was just saved has left the unsaved list, so fetch it back from
      // the sheet — otherwise the day's work looks as though it vanished
      loadDay();
    })
    .withFailureHandler(function(){
      // no signal: keep it on the phone and carry on
      enqueue('postMeasurement', payload,
        n+' measurement'+(n===1?'':'s')+', '+Math.round(ar).toLocaleString()+' m\u00b2');
      AREA.segs=[]; AREA.s2=''; AREA.darea=''; AREA.dnote=''; AREA.segT='';
      delete DRAFTS[code0]; saveDrafts();
      openArea(code0, 'Held on this phone \u2014 '+Math.round(ar).toLocaleString()+
        ' m\u00b2 will be sent when there is signal.');
    })
    .postMeasurement(payload);
}

function refresh(fromCode){
  document.getElementById('view').innerHTML=
    '<div class="center"><div class="spin"></div>Loading…</div>';
  google.script.run
    .withSuccessHandler(function(d){
      if(d && d.locked){ askCode(!!fromCode); return; }
      DATA=d;
      if(SCREEN==='item'&&CURRENT) openItem(CURRENT);
      else if(SCREEN==='picker') renderPicker();
      else renderHome();
    })
    .withFailureHandler(function(e){
      document.getElementById('view').innerHTML=
        '<div class="center">Could not load.<br><span class="muted">'+esc(e&&e.message)+
        '</span><br><br><button class="btn" onclick="refresh()">Try again</button></div>';
    })
    .getProgress(CODE);
}

PINS=loadPins();
loadDrafts();
loadCode();
loadQueue();
refresh();
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').then(function (reg) {
      // a stale app in the field is worse than no app: check on every load
      reg.addEventListener('updatefound', function () {
        var w = reg.installing;
        w.addEventListener('statechange', function () {
          if (w.state === 'installed' && navigator.serviceWorker.controller) {
            var bar = document.getElementById('qbar');
            if (bar) {
              bar.style.display = 'block';
              bar.innerHTML = 'A newer version is ready. ' +
                '<span style="text-decoration:underline" ' +
                'onclick="location.reload()">reload</span>';
            }
          }
        });
      });
      reg.update();
    });
  }
</script>
</body>
